name: Auto Pick (Manual Only - Disabled Pending Freshness Hardening)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only. Real submissions are disabled until stale-input fallbacks are fully removed.'
        required: false
        default: 'true'

permissions:
  contents: read
  actions: read

concurrency:
  group: auto-pick-disabled-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auto-pick-disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Disabled freshness gate
        run: |
          echo "Scheduled Auto Pick is disabled pending final stale-input hardening."
          echo "Reason: prior workflow used the committed locked card for schedule preflight and could fall back to card-derived picks."
          echo "Use Refresh Locked Superbru Card first; do not enable Auto Pick until live-only submission safeguards are reviewed."
          exit 1
