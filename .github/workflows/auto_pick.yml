name: Auto Pick (Scheduled)

on:
  workflow_dispatch:
    inputs:
      window_minutes:
        description: 'Submit picks for matches kicking off within this many minutes'
        required: false
        default: '40'
      dry_run:
        description: 'Dry run only; do not submit to SuperBru'
        required: false
        default: 'false'
  schedule:
    # Half-hour watcher for the knockout phase.
    # Runs at :05 and :35 UTC. With window_minutes=40 this covers :30 and :00
    # kickoff slots ~25 minutes before kickoff without hand-maintained cron lines.
    # The script only fetches match odds and submits when a fixture is actually
    # queued from the page scan or the committed locked-card fallback.
    - cron: '05,35 * 28-30 6 *'
    - cron: '05,35 * 1-20 7 *'

permissions:
  contents: read
  actions: read

concurrency:
  group: auto-pick-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auto-pick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[scraper]"
          python -m playwright install chromium --with-deps

      - name: Run match-scoped auto pick
        env:
          SUPERBRU_EMAIL: ${{ secrets.SUPERBRU_USERNAME || secrets.SUPERBRU_EMAIL }}
          SUPERBRU_PASSWORD: ${{ secrets.SUPERBRU_PASSWORD }}
          SUPERBRU_LOGIN_URL: ${{ secrets.SUPERBRU_LOGIN_URL }}
          SUPERBRU_POOL_URL: ${{ secrets.SUPERBRU_POOL_URL }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          SUPERBRU_PLAYER_NAME: ${{ secrets.SUPERBRU_PLAYER_NAME || 'Danie' }}
          SUPERBRU_POOL_KEYWORDS: ${{ secrets.SUPERBRU_POOL_KEYWORDS || 'Moore Infinity,FIFA WC 26,World Cup 2026' }}
        run: |
          POOL_URL="$SUPERBRU_POOL_URL"
          if [ -z "$POOL_URL" ]; then
            POOL_URL="https://www.superbru.com/worldcup_predictor/pool_view.php?t=1296&p=13236623&view=matches"
          fi
          LOGIN_URL="${SUPERBRU_LOGIN_URL:-https://www.superbru.com/login}"
          WINDOW_MINUTES="${{ github.event.inputs.window_minutes || '40' }}"
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          python scripts/auto_pick_match_scoped_smart_odds.py \
            --email "$SUPERBRU_EMAIL" \
            --password "$SUPERBRU_PASSWORD" \
            --login-url "$LOGIN_URL" \
            --pool-url "$POOL_URL" \
            --config config.yaml \
            --window-minutes "$WINDOW_MINUTES" \
            --pick-card-csv outputs/final_locked_picks/superbru_final_card.csv \
            --late-card-grace-minutes 0 \
            --odds-lookup-window-minutes 90 \
            --leader-player "${SUPERBRU_PLAYER_NAME:-Danie}" \
            --leaderboard-pool-keywords "${SUPERBRU_POOL_KEYWORDS:-Moore Infinity,FIFA WC 26,World Cup 2026}" \
            --leader-safe-buffer 5.0 \
            --chaser-range 8.0 \
            --headless \
            --require-submission \
            $DRY_RUN_FLAG \
            --out-dir outputs/pregame_checks/auto_pick

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-pick-results-${{ github.run_number }}
          path: outputs/pregame_checks/
          retention-days: 7
          if-no-files-found: warn
