name: Auto Pick (Scheduled)

on:
  schedule:
    # All times UTC; fires 20 and 10 min before each kickoff. window_minutes=25 covers cron delays.
    # Scheduled runs fetch match odds only when the visible SuperBru pick needs submission/change.

    # ── ROUND 2 remaining (Jun 21-24) ────────────────────────────────────────
    - cron: '40 15 21 6 *'   # Jun 21 16:00 UTC (12:00 ET) – ESP/KSA, 20 min before
    - cron: '50 15 21 6 *'   # Jun 21 16:00 UTC (12:00 ET) – ESP/KSA, 10 min before
    - cron: '40 18 21 6 *'   # Jun 21 19:00 UTC (15:00 ET) – BEL/IRN, 20 min before
    - cron: '50 18 21 6 *'   # Jun 21 19:00 UTC (15:00 ET) – BEL/IRN, 10 min before
    - cron: '40 21 21 6 *'   # Jun 21 22:00 UTC (18:00 ET) – URU/CPV, 20 min before
    - cron: '50 21 21 6 *'   # Jun 21 22:00 UTC (18:00 ET) – URU/CPV, 10 min before
    - cron: '40 0 22 6 *'    # Jun 22 01:00 UTC (21:00 ET) – NZL/EGY, 20 min before
    - cron: '50 0 22 6 *'    # Jun 22 01:00 UTC (21:00 ET) – NZL/EGY, 10 min before
    - cron: '40 16 22 6 *'   # Jun 22 17:00 UTC (13:00 ET) – ARG/AUT, 20 min before
    - cron: '50 16 22 6 *'   # Jun 22 17:00 UTC (13:00 ET) – ARG/AUT, 10 min before
    - cron: '40 20 22 6 *'   # Jun 22 21:00 UTC (17:00 ET) – FRA/IRQ, 20 min before
    - cron: '50 20 22 6 *'   # Jun 22 21:00 UTC (17:00 ET) – FRA/IRQ, 10 min before
    - cron: '40 23 22 6 *'   # Jun 23 00:00 UTC (20:00 ET) – NOR/SEN, 20 min before
    - cron: '50 23 22 6 *'   # Jun 23 00:00 UTC (20:00 ET) – NOR/SEN, 10 min before
    - cron: '40 2 23 6 *'    # Jun 23 03:00 UTC (23:00 ET) – JOR/ALG, 20 min before
    - cron: '50 2 23 6 *'    # Jun 23 03:00 UTC (23:00 ET) – JOR/ALG, 10 min before
    - cron: '40 16 23 6 *'   # Jun 23 17:00 UTC (13:00 ET) – POR/UZB, 20 min before
    - cron: '50 16 23 6 *'   # Jun 23 17:00 UTC (13:00 ET) – POR/UZB, 10 min before
    - cron: '40 19 23 6 *'   # Jun 23 20:00 UTC (16:00 ET) – ENG/GHA, 20 min before
    - cron: '50 19 23 6 *'   # Jun 23 20:00 UTC (16:00 ET) – ENG/GHA, 10 min before
    - cron: '40 22 23 6 *'   # Jun 23 23:00 UTC (19:00 ET) – PAN/CRO, 20 min before
    - cron: '50 22 23 6 *'   # Jun 23 23:00 UTC (19:00 ET) – PAN/CRO, 10 min before
    - cron: '40 1 24 6 *'    # Jun 24 02:00 UTC (22:00 ET) – COL/DRC, 20 min before
    - cron: '50 1 24 6 *'    # Jun 24 02:00 UTC (22:00 ET) – COL/DRC, 10 min before

    # ── ROUND 3 (Jun 24-28) ──────────────────────────────────────────────────
    - cron: '40 18 24 6 *'   # Jun 24 19:00 UTC (15:00 ET) – BHI/QAT, SUI/CAN, 20 min before
    - cron: '50 18 24 6 *'   # Jun 24 19:00 UTC (15:00 ET) – BHI/QAT, SUI/CAN, 10 min before
    - cron: '40 21 24 6 *'   # Jun 24 22:00 UTC (18:00 ET) – MOR/HAI, SCO/BRA, 20 min before
    - cron: '50 21 24 6 *'   # Jun 24 22:00 UTC (18:00 ET) – MOR/HAI, SCO/BRA, 10 min before
    - cron: '40 0 25 6 *'    # Jun 25 01:00 UTC (21:00 ET) – CZE/MEX, RSA/KOR, 20 min before
    - cron: '50 0 25 6 *'    # Jun 25 01:00 UTC (21:00 ET) – CZE/MEX, RSA/KOR, 10 min before
    - cron: '40 19 25 6 *'   # Jun 25 20:00 UTC (16:00 ET) – ECU/GER, CUR/CIV, 20 min before
    - cron: '50 19 25 6 *'   # Jun 25 20:00 UTC (16:00 ET) – ECU/GER, CUR/CIV, 10 min before
    - cron: '40 22 25 6 *'   # Jun 25 23:00 UTC (19:00 ET) – JPN/SWE, TUN/NED, 20 min before
    - cron: '50 22 25 6 *'   # Jun 25 23:00 UTC (19:00 ET) – JPN/SWE, TUN/NED, 10 min before
    - cron: '40 1 26 6 *'    # Jun 26 02:00 UTC (22:00 ET) – TUR/USA, PAR/AUS, 20 min before
    - cron: '50 1 26 6 *'    # Jun 26 02:00 UTC (22:00 ET) – TUR/USA, PAR/AUS, 10 min before
    - cron: '40 18 26 6 *'   # Jun 26 19:00 UTC (15:00 ET) – NOR/FRA, SEN/IRQ, 20 min before
    - cron: '50 18 26 6 *'   # Jun 26 19:00 UTC (15:00 ET) – NOR/FRA, SEN/IRQ, 10 min before
    - cron: '40 23 26 6 *'   # Jun 27 00:00 UTC (20:00 ET) – CPV/KSA, URU/ESP, 20 min before
    - cron: '50 23 26 6 *'   # Jun 27 00:00 UTC (20:00 ET) – CPV/KSA, URU/ESP, 10 min before
    - cron: '40 2 27 6 *'    # Jun 27 03:00 UTC (23:00 ET) – EGY/IRN, NZL/BEL, 20 min before
    - cron: '50 2 27 6 *'    # Jun 27 03:00 UTC (23:00 ET) – EGY/IRN, NZL/BEL, 10 min before
    - cron: '40 20 27 6 *'   # Jun 27 21:00 UTC (17:00 ET) – CRO/GHA, PAN/ENG, 20 min before
    - cron: '50 20 27 6 *'   # Jun 27 21:00 UTC (17:00 ET) – CRO/GHA, PAN/ENG, 10 min before
    - cron: '10 23 27 6 *'   # Jun 27 23:30 UTC (19:30 ET) – COL/POR, DRC/UZB, 20 min before
    - cron: '20 23 27 6 *'   # Jun 27 23:30 UTC (19:30 ET) – COL/POR, DRC/UZB, 10 min before
    - cron: '40 1 28 6 *'    # Jun 28 02:00 UTC (22:00 ET) – ALG/AUT, JOR/ARG, 20 min before
    - cron: '50 1 28 6 *'    # Jun 28 02:00 UTC (22:00 ET) – ALG/AUT, JOR/ARG, 10 min before

    # ── ROUND OF 32 → FINAL (Jun 28 – Jul 19) ───────────────────────────────
    # Standard knockout slots: 20:00, 23:00, 02:00 UTC (16:00/19:00/22:00 ET)
    - cron: '40 19 28-30 6 *'   # Jun 28-30 20:00 UTC slot, 20 min before
    - cron: '50 19 28-30 6 *'   # Jun 28-30 20:00 UTC slot, 10 min before
    - cron: '40 22 28-30 6 *'   # Jun 28-30 23:00 UTC slot, 20 min before
    - cron: '50 22 28-30 6 *'   # Jun 28-30 23:00 UTC slot, 10 min before
    - cron: '40 1 29-31 6 *'    # Jun 29-30 02:00 UTC slot, 20 min before
    - cron: '50 1 29-31 6 *'    # Jun 29-30 02:00 UTC slot, 10 min before
    - cron: '40 19 1-19 7 *'    # Jul 1-19 20:00 UTC slot, 20 min before
    - cron: '50 19 1-19 7 *'    # Jul 1-19 20:00 UTC slot, 10 min before
    - cron: '40 22 1-19 7 *'    # Jul 1-19 23:00 UTC slot, 20 min before
    - cron: '50 22 1-19 7 *'    # Jul 1-19 23:00 UTC slot, 10 min before
    - cron: '40 1 2-20 7 *'     # Jul 2-19 02:00 UTC slot, 20 min before
    - cron: '50 1 2-20 7 *'     # Jul 2-19 02:00 UTC slot, 10 min before

  workflow_dispatch:
    inputs:
      window_minutes:
        description: 'Submit picks for games kicking off within this many minutes'
        required: false
        default: '25'
      dry_run:
        description: 'Dry run only (predict but do not submit)'
        required: false
        default: 'false'
      fetch_match_odds:
        description: 'Fetch a one-match odds snapshot only when the visible SuperBru pick does not match the locked card.'
        required: false
        default: 'true'
      pool_url:
        description: 'SuperBru pool URL'
        required: false
        default: 'https://www.superbru.com/worldcup_predictor/pool_view.php?t=1296&p=13236623&view=matches'

jobs:
  auto-pick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[scraper]"
          python -m playwright install chromium --with-deps

      - name: Run match-scoped auto pick
        env:
          SUPERBRU_EMAIL: ${{ secrets.SUPERBRU_USERNAME }}
          SUPERBRU_PASSWORD: ${{ secrets.SUPERBRU_PASSWORD }}
          SUPERBRU_LOGIN_URL: ${{ secrets.SUPERBRU_LOGIN_URL }}
          SUPERBRU_POOL_URL: ${{ secrets.SUPERBRU_POOL_URL }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          MATCH_ODDS_FLAG=""
          if [ "${{ github.event.inputs.fetch_match_odds }}" = "false" ]; then
            MATCH_ODDS_FLAG="--skip-match-odds"
          fi

          POOL_URL="${{ github.event.inputs.pool_url || '' }}"
          if [ -z "$POOL_URL" ]; then
            POOL_URL="$SUPERBRU_POOL_URL"
          fi
          if [ -z "$POOL_URL" ]; then
            POOL_URL="https://www.superbru.com/worldcup_predictor/pool_view.php?t=1296&p=13236623&view=matches"
          fi

          LOGIN_URL="${SUPERBRU_LOGIN_URL:-https://www.superbru.com/login}"

          python scripts/auto_pick_match_scoped_smart_odds.py \
            --email "$SUPERBRU_EMAIL" \
            --password "$SUPERBRU_PASSWORD" \
            --login-url "$LOGIN_URL" \
            --pool-url "$POOL_URL" \
            --window-minutes "${{ github.event.inputs.window_minutes || '25' }}" \
            --pick-card-csv outputs/final_locked_picks/superbru_final_card.csv \
            --odds-lookup-window-minutes 90 \
            --headless \
            $DRY_RUN_FLAG \
            $MATCH_ODDS_FLAG \
            --out-dir outputs/pregame_checks/auto_pick

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-pick-results-${{ github.run_number }}
          path: outputs/pregame_checks/
          retention-days: 7
