name: Superbru Fixture Checker (Manual Only - Disabled Pending Auto Pick Hardening)

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: superbru-fixture-checker-disabled
  cancel-in-progress: false

jobs:
  check-fixtures-disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Disabled freshness gate
        run: |
          echo "Superbru Fixture Checker is disabled while Auto Pick is disabled."
          echo "Reason: it edits auto_pick.yml cron entries, which could reintroduce stale-card scheduling."
          echo "Re-enable only after Auto Pick is live-scan/live-odds only and no committed-card fallback remains."
          exit 1
