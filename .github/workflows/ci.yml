name: CI

on:
  push:
    paths-ignore:
      - 'outputs/**'
      - 'docs/superbru-automation-context.md'
  pull_request:
    paths-ignore:
      - 'outputs/**'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate workflow automation rules
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          workflow_dir = Path('.github/workflows')
          workflows = sorted(p.name for p in workflow_dir.glob('*.yml')) + sorted(p.name for p in workflow_dir.glob('*.yaml'))
          expected = {
              'auto_pick.yml',
              'check_superbru_fixtures.yml',
              'ci.yml',
              'data-inventory.yml',
              'deploy-polymarket-vps-paper.yml',
              'polymarket-mispricing-bot.yml',
              'polymarket-vps-proof-health.yml',
              'refresh-locked-superbru-card.yml',
              'repo-audit-bundle.yml',
              'superbru-clv-snapshot.yml',
          }
          forbidden_files = {
              'daily-superbru-robust.yml',
              'inspect_superbru_dom.yml',
              'submit_superbru_pick.yml',
              'test_submit_dry_run.yml',
          }
          expected_triggers = {
              'auto_pick.yml': {'schedule', 'workflow_dispatch'},
              'check_superbru_fixtures.yml': {'workflow_dispatch'},
              'data-inventory.yml': {'workflow_dispatch'},
              'deploy-polymarket-vps-paper.yml': {'workflow_dispatch'},
              'ci.yml': {'push', 'pull_request'},
              'polymarket-mispricing-bot.yml': {'workflow_dispatch'},
              'polymarket-vps-proof-health.yml': {'schedule', 'workflow_dispatch'},
              'refresh-locked-superbru-card.yml': {'schedule', 'workflow_dispatch'},
              'repo-audit-bundle.yml': {'push'},
              'superbru-clv-snapshot.yml': {'schedule', 'workflow_dispatch'},
          }
          possible_triggers = {'schedule', 'push', 'pull_request', 'workflow_dispatch'}

          def top_level_on_block(text: str) -> str:
              lines = text.splitlines()
              start = None
              for i, line in enumerate(lines):
                  if line.strip() == 'on:':
                      start = i
                      break
              if start is None:
                  return ''
              block = [lines[start]]
              for line in lines[start + 1:]:
                  if line and not line.startswith((' ', '\t')) and not line.lstrip().startswith('#'):
                      break
                  block.append(line)
              return '\n'.join(block)

          def declared_triggers(on_block: str) -> set[str]:
              found = set()
              for trigger in possible_triggers:
                  if re.search(rf'^  {re.escape(trigger)}\s*:', on_block, flags=re.MULTILINE):
                      found.add(trigger)
              return found

          failures = []
          present = set(workflows)
          missing = expected - present
          unexpected = present - expected
          forbidden_present = forbidden_files & present
          if missing:
              failures.append(f'Missing expected workflows: {sorted(missing)}')
          if unexpected:
              failures.append(f'Unexpected workflow files present: {sorted(unexpected)}')
          if forbidden_present:
              failures.append(f'Forbidden workflow files are present: {sorted(forbidden_present)}')

          manual_allowed = {
              'auto_pick.yml',
              'check_superbru_fixtures.yml',
              'data-inventory.yml',
              'deploy-polymarket-vps-paper.yml',
              'refresh-locked-superbru-card.yml',
              'polymarket-mispricing-bot.yml',
              'polymarket-vps-proof-health.yml',
              'superbru-clv-snapshot.yml',
          }
          for name in sorted(expected & present):
              text = (workflow_dir / name).read_text(encoding='utf-8')
              triggers = declared_triggers(top_level_on_block(text))
              if 'workflow_dispatch' in triggers and name not in manual_allowed:
                  failures.append(f'{name} declares manual workflow_dispatch trigger')
              missing_triggers = expected_triggers[name] - triggers
              extra_triggers = triggers - expected_triggers[name]
              if missing_triggers:
                  failures.append(f'{name} is missing trigger(s): {sorted(missing_triggers)}')
              if extra_triggers:
                  failures.append(f'{name} contains disallowed trigger(s): {sorted(extra_triggers)}')
              for required_text in ['timeout-minutes:', 'concurrency:', 'permissions:']:
                  if required_text not in text:
                      failures.append(f'{name} is missing {required_text}')

          if failures:
              print('Workflow automation validation failed:')
              for failure in failures:
                  print(f'- {failure}')
              sys.exit(1)
          print('Workflow automation validation passed.')
          print('Workflow files:', ', '.join(workflows))
          PY

      - name: Run lint
        run: ruff check .

      - name: Run tests
        run: pytest

      - name: Validate calibration profile
        run: python -m superbru_score_engine config-check --config config.yaml --profiles calibration_profiles.yaml

      - name: Run offline smoke prediction
        run: python -m superbru_score_engine predict --config config.example.yaml --fixtures examples/fixtures.csv --odds-json examples/odds_snapshot.json --out-dir outputs/smoke
