name: CI

on:
  push:
    paths-ignore:
      - 'outputs/**'
      - 'docs/superbru-automation-context.md'
  pull_request:
    paths-ignore:
      - 'outputs/**'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate workflow automation rules
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          workflow_dir = Path('.github/workflows')
          workflows = sorted(p.name for p in workflow_dir.glob('*.yml')) + sorted(p.name for p in workflow_dir.glob('*.yaml'))
          expected = {
              'auto_pick.yml',
              'check_superbru_fixtures.yml',
              'ci.yml',
              'data-inventory.yml',
              'polymarket-mispricing-bot.yml',
              'refresh-locked-superbru-card.yml',
              'repo-audit-bundle.yml',
          }
          forbidden_files = {
              'daily-superbru-robust.yml',
              'inspect_superbru_dom.yml',
              'submit_superbru_pick.yml',
              'test_submit_dry_run.yml',
          }
          expected_triggers = {
              # Auto Pick is intentionally manual-only and disabled until stale-card fallbacks are removed.
              'auto_pick.yml': {'workflow_dispatch'},
              'check_superbru_fixtures.yml': {'schedule', 'workflow_dispatch'},
              'ci.yml': {'push', 'pull_request'},
              'data-inventory.yml': {'schedule', 'push'},
              'polymarket-mispricing-bot.yml': {'workflow_dispatch'},
              'refresh-locked-superbru-card.yml': {'schedule', 'workflow_dispatch'},
              'repo-audit-bundle.yml': {'push'},
          }
          possible_triggers = {'schedule', 'push', 'pull_request', 'workflow_dispatch'}

          def top_level_on_block(text: str) -> str:
              lines = text.splitlines()
              start = None
              for i, line in enumerate(lines):
                  if line.strip() == 'on:':
                      start = i
                      break
              if start is None:
                  return ''
              block = [lines[start]]
              for line in lines[start + 1:]:
                  if line and not line.startswith((' ', '\t')) and not line.lstrip().startswith('#'):
                      break
                  block.append(line)
              return '\n'.join(block)

          def declared_triggers(on_block: str) -> set[str]:
              found = set()
              for trigger in possible_triggers:
                  if re.search(rf'^  {re.escape(trigger)}\s*:', on_block, flags=re.MULTILINE):
                      found.add(trigger)
              return found

          failures = []
          present = set(workflows)
          missing = expected - present
          unexpected = present - expected
          forbidden_present = forbidden_files & present
          if missing:
              failures.append(f'Missing expected automated workflows: {sorted(missing)}')
          if unexpected:
              failures.append(f'Unexpected workflow files present: {sorted(unexpected)}')
          if forbidden_present:
              failures.append(f'Manual-only workflow files are still present: {sorted(forbidden_present)}')

          for name in sorted(expected & present):
              path = workflow_dir / name
              text = path.read_text(encoding='utf-8')
              on_block = top_level_on_block(text)
              triggers = declared_triggers(on_block)
              if 'workflow_dispatch' in triggers and name not in {'auto_pick.yml', 'check_superbru_fixtures.yml', 'refresh-locked-superbru-card.yml', 'polymarket-mispricing-bot.yml'}:
                  failures.append(f'{name} declares manual workflow_dispatch trigger')
              required = expected_triggers[name]
              missing_triggers = required - triggers
              extra_triggers = triggers - required
              if missing_triggers:
                  failures.append(f'{name} is missing required automated trigger(s): {sorted(missing_triggers)}')
              if extra_triggers:
                  failures.append(f'{name} contains disallowed trigger(s): {sorted(extra_triggers)}')
              if 'timeout-minutes:' not in text:
                  failures.append(f'{name} is missing timeout-minutes')
              if 'concurrency:' not in text:
                  failures.append(f'{name} is missing concurrency')
              if 'permissions:' not in text:
                  failures.append(f'{name} is missing permissions')

          if failures:
              print('Workflow automation validation failed:')
              for failure in failures:
                  print(f'- {failure}')
              sys.exit(1)
          print('Workflow automation validation passed.')
          print('Automated workflow files:', ', '.join(workflows))
          PY

      - name: Run lint
        run: ruff check .

      - name: Run tests
        run: pytest

      - name: Run online Polymarket Dutch-book smoke test
        timeout-minutes: 5
        env:
          POLYMARKET_KILL_SWITCH: "1"
          POLYMARKET_LIVE_TRADING: "0"
        run: |
          python -m polymarket_predictive_engine.dutch_book_runner --config polymarket_predictive_config.example.yaml --cycles 1 --websocket-seconds 5 --sleep-seconds 0
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('outputs/polymarket_dutch_book/monitor_summary.json')
          assert path.exists(), 'Dutch-book monitor summary was not written'
          payload = json.loads(path.read_text(encoding='utf-8'))
          assert payload.get('dry_run_only') is True, payload
          assert payload.get('orders_placed') == 0, payload
          last = payload.get('last_summary') or {}
          assert last.get('orders_placed') == 0, payload
          print('Online Dutch-book smoke passed:', json.dumps(payload, sort_keys=True))
          PY

      - name: Validate calibration profile
        run: python -m superbru_score_engine config-check --config config.yaml --profiles calibration_profiles.yaml

      - name: Run online smoke prediction
        timeout-minutes: 5
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          if [ -z "${THE_ODDS_API_KEY:-}" ]; then
            echo "THE_ODDS_API_KEY secret is not configured for online smoke prediction."
            exit 1
          fi
          python -m superbru_score_engine predict --config config.yaml --out-dir outputs/online-smoke
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          csv_path = Path('outputs/online-smoke/predictions.csv')
          json_path = Path('outputs/online-smoke/predictions.json')
          assert csv_path.exists() and csv_path.stat().st_size > 0, 'predictions.csv was not written'
          assert json_path.exists() and json_path.stat().st_size > 0, 'predictions.json was not written'
          rows = list(csv.DictReader(csv_path.open(newline='', encoding='utf-8')))
          assert rows, 'online prediction produced no rows'
          payload = json.loads(json_path.read_text(encoding='utf-8'))
          assert isinstance(payload, list) and payload, 'online prediction JSON produced no rows'
          print(f'Online smoke prediction produced {len(rows)} prediction row(s).')
          PY

      - name: Run offline smoke prediction
        run: python -m superbru_score_engine predict --config config.example.yaml --fixtures examples/fixtures.csv --odds-json examples/odds_snapshot.json --out-dir outputs/smoke
