name: Daily Superbru Robust Card

on:
  schedule:
    # 07:00 South Africa time (SAST, UTC+2) = 05:00 UTC.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      skip_final_simulation:
        description: "Skip final leader simulation"
        type: boolean
        default: false
      snapshot_id:
        description: "Optional snapshot id, e.g. 20260620T050000Z"
        type: string
        required: false
        default: ""

permissions:
  contents: write
  actions: read
  issues: write

concurrency:
  group: daily-superbru-robust-card
  cancel-in-progress: false

jobs:
  daily-robust-card:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture previous robust card
        run: |
          mkdir -p outputs/daily_robust_card
          if [ -f outputs/daily_robust_card/daily_robust_superbru_card.csv ]; then
            cp outputs/daily_robust_card/daily_robust_superbru_card.csv outputs/daily_robust_card/previous_superbru_card.csv
            echo "Previous robust card captured."
          else
            echo "No previous robust card found. First run will not notify score changes."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy pyyaml requests

      - name: Run daily robust odds pipeline
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          PYTHONPATH: src
        run: |
          SNAPSHOT_ID="${{ inputs.snapshot_id }}"
          SKIP_FLAG=""
          if [ "${{ inputs.skip_final_simulation }}" = "true" ]; then
            SKIP_FLAG="--skip-final-simulation"
          fi
          if [ -n "$SNAPSHOT_ID" ]; then
            python scripts/run_daily_robust_pipeline.py --snapshot-id "$SNAPSHOT_ID" $SKIP_FLAG
          else
            python scripts/run_daily_robust_pipeline.py $SKIP_FLAG
          fi

      - name: Run Oddspedia SmartBet overlay validation
        if: success()
        run: |
          if [ -f inputs/smartbet_grids/oddspedia_probability_grids_auto.csv ] && [ -f inputs/smartbet_grids/oddspedia_probability_summary_auto.csv ]; then
            python scripts/compare_locked_picks_to_oddspedia.py \
              --locked-picks-csv outputs/final_locked_picks/superbru_final_card.csv \
              --oddspedia-grid-csv inputs/smartbet_grids/oddspedia_probability_grids_auto.csv \
              --oddspedia-summary-csv inputs/smartbet_grids/oddspedia_probability_summary_auto.csv \
              --out-csv outputs/oddspedia_pick_validation/oddspedia_pick_comparison.csv \
              --out-json outputs/oddspedia_pick_validation/oddspedia_pick_comparison_summary.json
          else
            echo "Oddspedia SmartBet grid inputs not found. Skipping overlay validation."
          fi

      - name: Add Oddspedia overlay summary
        if: success()
        run: |
          if [ -f outputs/oddspedia_pick_validation/oddspedia_pick_comparison.csv ]; then
            echo "## Oddspedia SmartBet overlay" >> "$GITHUB_STEP_SUMMARY"
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import pandas as pd
          p = "outputs/oddspedia_pick_validation/oddspedia_pick_comparison.csv"
          df = pd.read_csv(p).fillna("")
          review = df[~df["action"].isin(["keep", "no_grid"])]
          print(f"Matches compared: {len(df)}")
          print(f"Review items: {len(review)}")
          if len(review):
              cols = ["match_id", "locked_pick", "locked_pick_probability_pct", "oddspedia_best_score", "oddspedia_best_probability_pct", "probability_gap_vs_locked_pct", "action"]
              print("")
              print(review[cols].to_markdown(index=False))
          PY
          fi

      - name: Check whether score changes are needed
        id: score_changes
        if: success()
        run: |
          python scripts/notify_score_changes.py \
            --current-card-csv outputs/daily_robust_card/daily_robust_superbru_card.csv \
            --previous-card-csv outputs/daily_robust_card/previous_superbru_card.csv \
            --audit-csv outputs/daily_robust_card/daily_switch_audit.csv \
            --out-md outputs/daily_robust_card/score_change_notification.md \
            --github-output "$GITHUB_OUTPUT" \
            --github-step-summary "$GITHUB_STEP_SUMMARY"

      - name: Notify only when scores need changing
        if: steps.score_changes.outputs.notify == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Superbru score changes needed - $(date -u +%Y-%m-%d)" \
            --body-file outputs/daily_robust_card/score_change_notification.md

      - name: No score-change notification needed
        if: steps.score_changes.outputs.notify != 'true'
        run: |
          echo "No score changes needed. No GitHub issue notification created."

      - name: Upload daily robust outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-superbru-robust-card
          path: |
            outputs/market_odds/*.csv
            outputs/market_odds/*.json
            outputs/market_odds_validation/*.csv
            outputs/market_odds_validation/*.json
            outputs/market_odds_history/*.csv
            outputs/market_odds_history/*.json
            outputs/component_validation/*.csv
            outputs/component_validation/*.json
            outputs/final_locked_picks/*.csv
            outputs/final_locked_picks/*.json
            outputs/daily_robust_card/*.csv
            outputs/daily_robust_card/*.json
            outputs/daily_robust_card/*.md
            outputs/oddspedia_pick_validation/*.csv
            outputs/oddspedia_pick_validation/*.json
            outputs/final_leader_decision_daily_robust/**/*.csv
            outputs/final_leader_decision_daily_robust/**/*.json
          if-no-files-found: warn

      - name: Commit daily outputs
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f outputs/market_odds outputs/market_odds_validation outputs/market_odds_history outputs/component_validation outputs/final_locked_picks outputs/daily_robust_card outputs/oddspedia_pick_validation outputs/final_leader_decision_daily_robust || true
          if git diff --cached --quiet; then
            echo "No daily output changes to commit."
          else
            git commit -m "Update daily Superbru robust card"
            git push
          fi
