name: Daily Superbru Robust Card

on:
  schedule:
    # 07:00 South Africa time (SAST, UTC+2) = 05:00 UTC.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      skip_final_simulation:
        description: "Skip final leader simulation"
        type: boolean
        default: false
      snapshot_id:
        description: "Optional snapshot id, e.g. 20260620T050000Z"
        type: string
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: daily-superbru-robust-card
  cancel-in-progress: false

jobs:
  daily-robust-card:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy pyyaml requests

      - name: Run daily robust odds pipeline
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          PYTHONPATH: src
        run: |
          SNAPSHOT_ID="${{ inputs.snapshot_id }}"
          SKIP_FLAG=""
          if [ "${{ inputs.skip_final_simulation }}" = "true" ]; then
            SKIP_FLAG="--skip-final-simulation"
          fi
          if [ -n "$SNAPSHOT_ID" ]; then
            python scripts/run_daily_robust_pipeline.py --snapshot-id "$SNAPSHOT_ID" $SKIP_FLAG
          else
            python scripts/run_daily_robust_pipeline.py $SKIP_FLAG
          fi

      - name: Upload daily robust outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-superbru-robust-card
          path: |
            outputs/market_odds/*.csv
            outputs/market_odds/*.json
            outputs/market_odds_validation/*.csv
            outputs/market_odds_validation/*.json
            outputs/market_odds_history/*.csv
            outputs/market_odds_history/*.json
            outputs/component_validation/*.csv
            outputs/component_validation/*.json
            outputs/final_locked_picks/*.csv
            outputs/final_locked_picks/*.json
            outputs/daily_robust_card/*.csv
            outputs/daily_robust_card/*.json
            outputs/final_leader_decision_daily_robust/**/*.csv
            outputs/final_leader_decision_daily_robust/**/*.json
          if-no-files-found: warn

      - name: Commit daily outputs
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f outputs/market_odds outputs/market_odds_validation outputs/market_odds_history outputs/component_validation outputs/final_locked_picks outputs/daily_robust_card outputs/final_leader_decision_daily_robust || true
          if git diff --cached --quiet; then
            echo "No daily output changes to commit."
          else
            git commit -m "Update daily Superbru robust card"
            git push
          fi
