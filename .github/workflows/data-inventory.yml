name: Data Inventory

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: data-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Paused
        run: |
          echo "Data Inventory is paused for manual review."
          exit 1
