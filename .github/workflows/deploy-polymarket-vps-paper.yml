name: Deploy Polymarket VPS Paper

on:
  workflow_dispatch:
    inputs:
      acceptance_run_id:
        description: Successful Independently Reviewed PR Merge run that produced this exact main SHA
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-polymarket-vps-paper
  cancel-in-progress: false

jobs:
  deploy:
    # The account's GitHub-hosted minutes can be exhausted independently of
    # repository health. The provisioned VPS runner is outside the paper
    # compose stack, so it remains available while those containers restart.
    runs-on: [self-hosted, Linux, ARM64, polymarket-ci]
    # 2026-07-07: 20 -> 30. Under VPS memory pressure the post-deploy governance
    # refresh ran 9+ minutes and the whole job was cancelled at exactly 20:00,
    # leaving the deploy unverified. 30 gives the slow-host worst case headroom.
    # 2026-07-09: raised 30 -> 40. Deploy durations crept 25.5 -> 29 -> 29.5 min
    # through 2026-07-08 (image rebuild + slow VPS) and the 04:27 UTC run was
    # cancelled at the 30-min cap mid-rollout.
    timeout-minutes: 40

    steps:
      - name: Download independent-main acceptance
        uses: actions/download-artifact@v8
        with:
          name: independent-main-acceptance-${{ inputs.acceptance_run_id }}
          path: ${{ runner.temp }}/independent-main-acceptance
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.acceptance_run_id }}

      - name: Bind deployment to independently accepted main
        env:
          ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from urllib.request import Request, urlopen

          run_id = os.environ["ACCEPTANCE_RUN_ID"]
          if not re.fullmatch(r"[1-9][0-9]*", run_id):
              raise SystemExit("acceptance_run_id must be a positive GitHub Actions run ID")
          request = Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "User-Agent": "polymarket-vps-deploy-acceptance",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urlopen(request, timeout=30) as response:  # noqa: S310 - fixed GitHub API origin
              run = json.loads(response.read().decode("utf-8"))
          expected_path = ".github/workflows/independent-pr-merge.yml"
          if run.get("path") != expected_path or run.get("event") != "workflow_dispatch":
              raise SystemExit("acceptance artifact did not originate from the registered merge workflow")
          if run.get("status") != "completed" or run.get("conclusion") != "success":
              raise SystemExit("independent merge workflow is not a completed success")

          artifact = Path(os.environ["RUNNER_TEMP"]) / "independent-main-acceptance" / "merge-attestation.json"
          attestation = json.loads(artifact.read_text(encoding="utf-8"))
          target = os.environ["TARGET_SHA"].lower()
          actor = str((run.get("actor") or {}).get("login") or "")
          triggering_actor = str((run.get("triggering_actor") or {}).get("login") or "")
          author = str(attestation.get("pull_request_author") or "")
          reviewers = {str(value).casefold() for value in attestation.get("eligible_reviewers", [])}
          checks = attestation.get("checks") if isinstance(attestation.get("checks"), dict) else {}
          if attestation.get("status") != "merged" or attestation.get("merged") is not True:
              raise SystemExit("independent merge attestation does not record a completed merge")
          if str(attestation.get("merge_commit_sha") or "").lower() != target:
              raise SystemExit("independent merge attestation is for a different main SHA")
          if attestation.get("blockers"):
              raise SystemExit("independent merge attestation contains blockers")
          if not checks or not all(value is True for value in checks.values()):
              raise SystemExit("independent merge attestation contains an unsatisfied control")
          if not actor or actor.casefold() == author.casefold() or actor.casefold() not in reviewers:
              raise SystemExit("merge workflow actor was not an independent current-head approver")
          if (
              not triggering_actor
              or triggering_actor.casefold() == author.casefold()
              or triggering_actor.casefold() not in reviewers
          ):
              raise SystemExit("merge workflow triggering actor was not an independent current-head approver")
          print(f"Independent acceptance verified for main {target[:12]} via run {run_id}")
          PY

      - name: Validate deploy secrets
        env:
          PM_VPS_HOST: ${{ secrets.PM_VPS_HOST }}
          PM_VPS_USER: ${{ secrets.PM_VPS_USER }}
          PM_VPS_SSH_PRIVATE_KEY: ${{ secrets.PM_VPS_SSH_PRIVATE_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          SUPERBRU_EMAIL: ${{ secrets.SUPERBRU_EMAIL }}
          SUPERBRU_USERNAME: ${{ secrets.SUPERBRU_USERNAME }}
          SUPERBRU_PASSWORD: ${{ secrets.SUPERBRU_PASSWORD }}
          SUPERBRU_POOL_URL: ${{ secrets.SUPERBRU_POOL_URL }}
        run: |
          set -euo pipefail
          missing=0
          for name in PM_VPS_HOST PM_VPS_USER PM_VPS_SSH_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Repository secret ${name} is required for VPS deployment."
              missing=1
            fi
          done
          if [ -z "${THE_ODDS_API_KEY:-}" ]; then
            echo "::warning::THE_ODDS_API_KEY is not set; sharp-anchor odds fetching will remain disabled on the VPS."
          fi
          if { [ -z "${SUPERBRU_EMAIL:-}" ] && [ -z "${SUPERBRU_USERNAME:-}" ]; } || [ -z "${SUPERBRU_PASSWORD:-}" ] || [ -z "${SUPERBRU_POOL_URL:-}" ]; then
            echo "::warning::SuperBru secrets are incomplete; VPS auto-pick watchdog will deploy but idle until credentials are present."
          fi
          exit "$missing"

      - name: Prepare SSH
        env:
          PM_VPS_HOST: ${{ secrets.PM_VPS_HOST }}
          PM_VPS_PORT: ${{ secrets.PM_VPS_PORT || '22' }}
          PM_VPS_SSH_PRIVATE_KEY: ${{ secrets.PM_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/ssh"
          python3 - <<'PY'
          import os
          from pathlib import Path

          raw_key = os.environ.get("PM_VPS_SSH_PRIVATE_KEY", "")
          # GitHub's UI/API can preserve multiline secrets, but operators sometimes
          # paste literal "\n" sequences. Normalise that into an OpenSSH key file.
          if "\\n" in raw_key and "\n" not in raw_key:
              raw_key = raw_key.replace("\\n", "\n")
          raw_key = raw_key.replace("\r\n", "\n").replace("\r", "\n").strip() + "\n"
          Path(os.environ["RUNNER_TEMP"], "ssh", "vps_key").write_text(raw_key, encoding="utf-8")
          PY
          chmod 600 "$RUNNER_TEMP/ssh/vps_key"
          if ! ssh-keygen -y -f "$RUNNER_TEMP/ssh/vps_key" >/dev/null 2>&1; then
            echo "::error::PM_VPS_SSH_PRIVATE_KEY is present but is not a loadable private key. Store the full private key file, not the .pub public key or a PuTTY .ppk file."
            exit 1
          fi
          ssh-keygen -y -f "$RUNNER_TEMP/ssh/vps_key" > "$RUNNER_TEMP/ssh/vps_key.pub"
          ssh-keyscan -p "$PM_VPS_PORT" -H "$PM_VPS_HOST" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/known_hosts"

      - name: Validate VPS SSH authorization
        env:
          PM_VPS_HOST: ${{ secrets.PM_VPS_HOST }}
          PM_VPS_PORT: ${{ secrets.PM_VPS_PORT || '22' }}
          PM_VPS_USER: ${{ secrets.PM_VPS_USER }}
        run: |
          set -euo pipefail
          if ! ssh \
            -i "$RUNNER_TEMP/ssh/vps_key" \
            -o BatchMode=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -o TCPKeepAlive=yes \
            -o ConnectTimeout=30 \
            -p "$PM_VPS_PORT" \
            "$PM_VPS_USER@$PM_VPS_HOST" \
            "echo VPS_SSH_OK" >/dev/null 2>&1; then
            pub_key="$(cat "$RUNNER_TEMP/ssh/vps_key.pub")"
            echo "::error::The deploy private key is valid, but the VPS rejected it. Add this public key to /home/${PM_VPS_USER}/.ssh/authorized_keys on ${PM_VPS_HOST}: ${pub_key}"
            exit 1
          fi

      - name: Create VPS environment patch
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          SUPERBRU_EMAIL: ${{ secrets.SUPERBRU_EMAIL }}
          SUPERBRU_USERNAME: ${{ secrets.SUPERBRU_USERNAME }}
          SUPERBRU_PASSWORD: ${{ secrets.SUPERBRU_PASSWORD }}
          SUPERBRU_LOGIN_URL: ${{ secrets.SUPERBRU_LOGIN_URL }}
          SUPERBRU_POOL_URL: ${{ secrets.SUPERBRU_POOL_URL }}
          SUPERBRU_PLAYER_NAME: ${{ secrets.SUPERBRU_PLAYER_NAME || 'Danie' }}
          SUPERBRU_POOL_KEYWORDS: ${{ secrets.SUPERBRU_POOL_KEYWORDS || 'Moore Infinity,FIFA WC 26,World Cup 2026' }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          patch_file="$RUNNER_TEMP/polymarket-vps-env.patch"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          keys = [
              "THE_ODDS_API_KEY",
              "SUPERBRU_EMAIL",
              "SUPERBRU_USERNAME",
              "SUPERBRU_PASSWORD",
              "SUPERBRU_LOGIN_URL",
              "SUPERBRU_POOL_URL",
              "SUPERBRU_PLAYER_NAME",
              "SUPERBRU_POOL_KEYWORDS",
          ]
          updates = {key: os.environ[key] for key in keys if os.environ.get(key)}
          updates["PM_VPS_DEPLOYED_SHA"] = os.environ["GITHUB_SHA"]
          # The VPS ops scheduler is the single governance-refresh owner. This
          # also repairs historical .env files that predate that invariant.
          updates["POLYMARKET_GOVERNANCE_REFRESH_SECONDS"] = "0"
          # Compose hard-codes loopback independently, and this repairs stale
          # host documentation without allowing an environment override to
          # widen the listener.
          updates["POLYMARKET_DASHBOARD_HOST"] = "127.0.0.1"
          Path(os.environ["RUNNER_TEMP"], "polymarket-vps-env.patch").write_text(
              json.dumps(updates, ensure_ascii=False),
              encoding="utf-8",
          )
          PY
          chmod 600 "$patch_file"

      - name: Copy environment patch
        env:
          PM_VPS_HOST: ${{ secrets.PM_VPS_HOST }}
          PM_VPS_PORT: ${{ secrets.PM_VPS_PORT || '22' }}
          PM_VPS_USER: ${{ secrets.PM_VPS_USER }}
        run: |
          set -euo pipefail
          scp \
            -i "$RUNNER_TEMP/ssh/vps_key" \
            -o BatchMode=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -o TCPKeepAlive=yes \
            -o ConnectTimeout=30 \
            -P "$PM_VPS_PORT" \
            "$RUNNER_TEMP/polymarket-vps-env.patch" \
            "$PM_VPS_USER@$PM_VPS_HOST:/tmp/polymarket-vps-env.patch.$GITHUB_RUN_ID"

      - name: Pull, rebuild, and verify VPS paper stack
        env:
          PM_VPS_HOST: ${{ secrets.PM_VPS_HOST }}
          PM_VPS_PORT: ${{ secrets.PM_VPS_PORT || '22' }}
          PM_VPS_USER: ${{ secrets.PM_VPS_USER }}
          PM_VPS_REPO_DIR: ${{ secrets.PM_VPS_REPO_DIR || '~/Claude' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # Keepalives are essential here: the remote rebuild + governance refresh has
          # long silent phases (image layer export, refresh-governance) with no stdout.
          # Without SSH-level keepalive probes a NAT/firewall idle timeout drops the
          # connection mid-deploy ("client_loop: send disconnect: Broken pipe", exit 255)
          # even though the deploy itself succeeded. ServerAlive* keeps the channel warm.
          ssh \
            -i "$RUNNER_TEMP/ssh/vps_key" \
            -o BatchMode=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -o TCPKeepAlive=yes \
            -o ConnectTimeout=30 \
            -p "$PM_VPS_PORT" \
            "$PM_VPS_USER@$PM_VPS_HOST" \
            "PM_VPS_HOST='$PM_VPS_HOST' PM_VPS_REPO_DIR='$PM_VPS_REPO_DIR' GITHUB_REPOSITORY='$GITHUB_REPOSITORY' GITHUB_SHA='$GITHUB_SHA' GITHUB_RUN_ID='$GITHUB_RUN_ID' bash -s" <<'REMOTE'
          set -euo pipefail

          REPO_DIR="${PM_VPS_REPO_DIR/#\~/$HOME}"
          COMPOSE_FILE="${PM_VPS_COMPOSE_FILE:-docker-compose.vps-paper.yml}"
          ENV_PATCH="/tmp/polymarket-vps-env.patch.${GITHUB_RUN_ID}"

          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            DOCKER="docker"
          else
            DOCKER="sudo docker"
          fi
          if [ "$(id -u)" -eq 0 ]; then
            SUDO=""
          else
            SUDO="sudo"
          fi

          if [ ! -d "$REPO_DIR/.git" ]; then
            git clone "https://github.com/${GITHUB_REPOSITORY}.git" "$REPO_DIR"
          fi

          cd "$REPO_DIR"
          git fetch --prune origin main
          git cat-file -e "${GITHUB_SHA}^{commit}"
          accepted_main_sha="$(git rev-parse origin/main)"
          if [ "$GITHUB_SHA" != "$accepted_main_sha" ]; then
            echo "::error::Deploy target $GITHUB_SHA is not current accepted main $accepted_main_sha."
            exit 1
          fi

          if [ ! -f .env ]; then
            cp .env.vps-paper.example .env
            chmod 600 .env
          fi

          # Bind-mounted containers can create these status directories as
          # root. The host-side preflight/baseline writers use atomic sibling
          # temp files, so restore ownership to the SSH deployment account
          # before any write. Scope is deliberately limited to generated
          # reporting directories; runtime ledgers and source are untouched.
          $SUDO install -d -m 0775 -o "$(id -u)" -g "$(id -g)" \
            outputs/performance outputs/ops_scheduler

          # Validate the TARGET revision without changing the mounted checkout.
          # If this refuses, every existing container and its deployed marker
          # remain byte-for-byte untouched.
          PREFLIGHT_DIR=$(mktemp -d)
          trap 'rm -rf "$PREFLIGHT_DIR" "$ENV_PATCH"' EXIT
          git show "${GITHUB_SHA}:scripts/preflight_vps_capacity.py" > "$PREFLIGHT_DIR/preflight_vps_capacity.py"
          git show "${GITHUB_SHA}:scripts/update_vps_checkout_preserving_runtime.py" > "$PREFLIGHT_DIR/update_vps_checkout_preserving_runtime.py"
          git show "${GITHUB_SHA}:$COMPOSE_FILE" > "$PREFLIGHT_DIR/compose.yml"
          # Reclaim dangling builder cache AND dangling images before measuring
          # deploy capacity. The stack rebuilds one tag (polymarket-paper-vps:
          # latest) every deploy, so each prior build's layers become dangling
          # and were never reclaimed (observed: disk 76%->83% in two days,
          # 2026-07-17 preflight refusal at 5.49GB free vs the 6GB floor).
          # Dangling-only pruning cannot touch tagged or in-use images, and the
          # rollback contract preserves the running image under a durable tag, so
          # production containers, volumes, and evidence ledgers stay intact.
          echo "[deploy] reclaiming unused Docker builder cache and dangling images"
          $DOCKER builder prune --force
          $DOCKER image prune --force
          echo "[deploy] checking host capacity against target compose commitments"
          python3 "$PREFLIGHT_DIR/preflight_vps_capacity.py" \
            --compose "$PREFLIGHT_DIR/compose.yml" \
            --env-file .env \
            --output outputs/performance/vps_capacity_preflight.json \
            --root .

          # Private transport is a pre-cutover requirement. A missing or
          # logged-out Tailscale node must leave the existing stack untouched.
          if ! command -v tailscale >/dev/null 2>&1; then
            echo "::error::Tailscale is not installed; refusing to expose or deploy the dashboard."
            exit 1
          fi
          $SUDO tailscale status --json > "$PREFLIGHT_DIR/tailscale-status.json"
          dashboard_dns="$(python3 - "$PREFLIGHT_DIR/tailscale-status.json" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          state = str(payload.get("BackendState") or "")
          dns_name = str((payload.get("Self") or {}).get("DNSName") or "").strip().rstrip(".").lower()
          ips = [str(value) for value in payload.get("TailscaleIPs", []) if value]
          if state != "Running" or not dns_name.endswith(".ts.net") or not ips:
              raise SystemExit("Tailscale must be authenticated with MagicDNS/HTTPS before deployment")
          print(dns_name)
          PY
          )"
          dashboard_private_url="https://${dashboard_dns}/"
          dashboard_port="$(python3 - <<'PY'
          from pathlib import Path

          value = ""
          for raw_line in Path(".env").read_text(encoding="utf-8").splitlines():
              stripped = raw_line.strip()
              if not stripped or stripped.startswith("#") or "=" not in stripped:
                  continue
              key, raw_value = stripped.split("=", 1)
              if key.strip() != "POLYMARKET_DASHBOARD_PORT":
                  continue
              value = raw_value.strip()
              if len(value) >= 2 and value[0] == value[-1] and value[0] in {"'", '"'}:
                  value = value[1:-1].strip()
          print(value or "8765")
          PY
          )"
          case "$dashboard_port" in
            *[!0-9]*|'') echo "::error::Invalid dashboard port: $dashboard_port"; exit 1 ;;
          esac
          if [ "$dashboard_port" -lt 1 ] || [ "$dashboard_port" -gt 65535 ]; then
            echo "::error::Dashboard port is outside 1-65535: $dashboard_port"
            exit 1
          fi

          # Stage private transport values in the already mode-0600 deploy
          # patch. Do not mutate .env or Tailscale before rollback is armed.
          DASHBOARD_PRIVATE_URL="$dashboard_private_url" ENV_PATCH_PATH="$ENV_PATCH" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          patch_path = Path(os.environ["ENV_PATCH_PATH"])
          updates = json.loads(patch_path.read_text(encoding="utf-8"))
          updates["POLYMARKET_DASHBOARD_HOST"] = "127.0.0.1"
          updates["PM_DASHBOARD_PUBLIC_URL"] = os.environ["DASHBOARD_PRIVATE_URL"]
          temporary = patch_path.with_name(patch_path.name + ".private-transport.tmp")
          temporary.write_text(json.dumps(updates, ensure_ascii=False), encoding="utf-8")
          temporary.chmod(0o600)
          temporary.replace(patch_path)
          PY

          # Freeze bind-mounted writers only after target-revision capacity
          # has passed. This prevents files changing between stash capture and
          # reapply. If the updater refuses before moving HEAD, restore the old
          # containers from their existing image before failing the job.
          original_head="$(git rev-parse HEAD)"
          previous_deployed_sha="$(cat outputs/performance/deployed_git_rev 2>/dev/null || true)"
          if [ -z "$previous_deployed_sha" ] || [ "$previous_deployed_sha" != "$original_head" ]; then
            echo "::error::Cannot arm rollback: checkout $original_head and deployed marker ${previous_deployed_sha:-missing} are not aligned."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$original_head" "$GITHUB_SHA"; then
            echo "::error::Deploy target is not a fast-forward descendant of the last-known-good revision."
            exit 1
          fi
          echo "[deploy] capturing pre-deploy operating-state acceptance baseline"
          ORIGINAL_HEAD="$original_head" python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          source = Path("outputs/performance/operating_state.json")
          target = Path("outputs/ops_scheduler/deploy_acceptance_baseline.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          try:
              operating_state = json.loads(source.read_text(encoding="utf-8")) if source.exists() else {}
          except (OSError, ValueError):
              operating_state = {}
          deployed_marker = Path("outputs/performance/deployed_git_rev")
          previous_deployed_sha = (
              deployed_marker.read_text(encoding="utf-8").strip()
              if deployed_marker.exists()
              else os.environ.get("ORIGINAL_HEAD", "")
          )
          payload = {
              "work_order": "WO-79",
              "captured_at_utc": datetime.now(timezone.utc).isoformat(),
              "previous_checkout_sha": os.environ.get("ORIGINAL_HEAD", ""),
              "previous_deployed_sha": previous_deployed_sha,
              "target_deploy_sha": os.environ.get("GITHUB_SHA", ""),
              "operating_state": operating_state,
              "paper_trading_invoked": False,
              "live_trading_invoked": False,
          }
          temporary = target.with_name(target.name + ".tmp")
          temporary.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          temporary.replace(target)
          PY

          # Arm rollback before the first persistent transport/deploy mutation.
          # Preserve the environment (plus a tighten-only private overlay),
          # deployed marker, source revision, and running image. Any later
          # non-zero exit invokes the target revision's tested rollback utility.
          ROLLBACK_DIR="$(mktemp -d)"
          ROLLBACK_ENV="$ROLLBACK_DIR/.env.last-known-good"
          ROLLBACK_MARKER="$ROLLBACK_DIR/deployed_git_rev.last-known-good"
          ROLLBACK_SCRIPT="$ROLLBACK_DIR/rollback_vps_paper_deploy.py"
          ROLLBACK_TELEMETRY_WRITER="$ROLLBACK_DIR/write_vps_telemetry_manifest.py"
          ROLLBACK_TRANSPORT_VALIDATOR="$ROLLBACK_DIR/validate_dashboard_private_transport.py"
          ROLLBACK_IMAGE_TAG="polymarket-paper-vps:rollback-last-known-good"
          chmod 0700 "$ROLLBACK_DIR"
          ROLLBACK_ARMED=false
          DEPLOY_COMMITTED=false

          deploy_exit() {
            deploy_status="$1"
            trap - EXIT
            set +e
            preserve_recovery=false
            if [ "$deploy_status" -ne 0 ] && [ "${ROLLBACK_ARMED:-false}" = true ] && [ "${DEPLOY_COMMITTED:-false}" != true ]; then
              failed_checkout="$(git rev-parse HEAD 2>/dev/null || true)"
              if [ "$failed_checkout" = "$original_head" ]; then
                echo "::warning::Candidate deploy failed before checkout changed; ensuring the last-known-good stack is running without invoking rollback."
                $DOCKER compose -f "$COMPOSE_FILE" up -d --no-build
                rollback_status=$?
              else
                echo "::warning::Candidate deploy failed; restoring last-known-good revision $original_head."
                python3 "$ROLLBACK_SCRIPT" \
                  --repo "$REPO_DIR" \
                  --rollback-ref "$original_head" \
                  --branch main \
                  --compose-file "$COMPOSE_FILE" \
                  --env-backup "$ROLLBACK_ENV" \
                  --marker-backup "$ROLLBACK_MARKER" \
                  --marker-was-present \
                  --image-backup-tag "$ROLLBACK_IMAGE_TAG" \
                  --docker-command "$DOCKER" \
                  --telemetry-writer "$ROLLBACK_TELEMETRY_WRITER" \
                  --tailscale-command "$SUDO tailscale" \
                  --transport-validator "$ROLLBACK_TRANSPORT_VALIDATOR" \
                  --private-dashboard-url "$dashboard_private_url" \
                  --failed-target-sha "$GITHUB_SHA" \
                  --required-service polymarket-paper-live \
                  --required-service polymarket-dashboard \
                  --required-service superbru-auto-pick-watchdog \
                  --required-service vps-ops-scheduler \
                  --report outputs/performance/vps_deploy_rollback.json
                rollback_status=$?
              fi
              if [ "$rollback_status" -ne 0 ]; then
                recovery_parent="$HOME/.polymarket-deploy-recovery"
                recovery_dir="$recovery_parent/$GITHUB_RUN_ID"
                install -d -m 0700 "$recovery_parent"
                rm -rf "$recovery_dir"
                mv "$ROLLBACK_DIR" "$recovery_dir"
                preserve_recovery=true
                echo "::error::Automatic rollback failed; secret-bearing recovery material was not printed and is retained mode-0700 at $recovery_dir."
                deploy_status=70
              else
                echo "::warning::Automatic rollback completed and the previous stack passed its health check."
              fi
            fi
            rm -f "$ENV_PATCH"
            rm -rf "$PREFLIGHT_DIR"
            if [ "$preserve_recovery" != true ]; then
              rm -rf "$ROLLBACK_DIR"
            fi
            exit "$deploy_status"
          }
          trap 'deploy_exit $?' EXIT

          install -m 0600 .env "$ROLLBACK_ENV"
          # Rollback restores the last-known-good runtime with a tighten-only
          # private URL overlay, even when the old revision predates it.
          DASHBOARD_PRIVATE_URL="$dashboard_private_url" ENV_PATH="$ROLLBACK_ENV" python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["ENV_PATH"])
          updates = {
              "POLYMARKET_DASHBOARD_HOST": "127.0.0.1",
              "PM_DASHBOARD_PUBLIC_URL": os.environ["DASHBOARD_PRIVATE_URL"],
          }
          lines = path.read_text(encoding="utf-8").splitlines()
          rendered = []
          seen = set()
          for line in lines:
              if not line.lstrip().startswith("#") and "=" in line:
                  key = line.split("=", 1)[0]
                  if key in updates:
                      rendered.append(f"{key}={updates[key]}")
                      seen.add(key)
                      continue
              rendered.append(line)
          for key, value in updates.items():
              if key not in seen:
                  rendered.append(f"{key}={value}")
          temporary = path.with_name(path.name + ".secure.tmp")
          temporary.write_text("\n".join(rendered) + "\n", encoding="utf-8")
          temporary.chmod(0o600)
          temporary.replace(path)
          PY
          install -m 0600 outputs/performance/deployed_git_rev "$ROLLBACK_MARKER"
          git show "${GITHUB_SHA}:scripts/rollback_vps_paper_deploy.py" > "$ROLLBACK_SCRIPT"
          git show "${GITHUB_SHA}:scripts/write_vps_telemetry_manifest.py" > "$ROLLBACK_TELEMETRY_WRITER"
          git show "${GITHUB_SHA}:scripts/validate_dashboard_private_transport.py" > "$ROLLBACK_TRANSPORT_VALIDATOR"
          chmod 0700 "$ROLLBACK_SCRIPT"
          chmod 0700 "$ROLLBACK_TELEMETRY_WRITER"
          chmod 0700 "$ROLLBACK_TRANSPORT_VALIDATOR"
          previous_image_id="$($DOCKER inspect --format '{{.Image}}' polymarket-paper-live)"
          if [ -z "$previous_image_id" ]; then
            echo "::error::Cannot arm rollback: current paper image ID is unavailable."
            exit 1
          fi
          $DOCKER image tag "$previous_image_id" "$ROLLBACK_IMAGE_TAG"
          ROLLBACK_ARMED=true

          # Tailscale and persistent environment changes are recoverable from
          # this point. Prove the private route against the still-running
          # last-known-good backend before quiescing any writer.
          $SUDO tailscale funnel --https=443 off >/dev/null 2>&1 || true
          $SUDO tailscale serve --bg --yes --https=443 "http://127.0.0.1:${dashboard_port}"
          curl -fsS --max-time 20 "$dashboard_private_url" >/dev/null

          echo "[deploy] quiescing paper writers for a consistent runtime snapshot"
          $DOCKER compose -f "$COMPOSE_FILE" stop --timeout 60
          echo "[deploy] updating source while preserving tracked and untracked runtime evidence"
          if ! python3 "$PREFLIGHT_DIR/update_vps_checkout_preserving_runtime.py" \
            --repo . \
            --target-ref "$GITHUB_SHA" \
            --branch main \
            --report outputs/performance/vps_checkout_update.json; then
            if [ "$(git rev-parse HEAD)" = "$original_head" ]; then
              echo "[deploy] source unchanged after refusal; restoring previous paper stack"
              $DOCKER compose -f "$COMPOSE_FILE" up -d --no-build || true
            fi
            exit 1
          fi

          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::VPS checked out $(git rev-parse HEAD), expected $GITHUB_SHA"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          env_path = Path(".env")
          patch_path = Path("/tmp/polymarket-vps-env.patch." + __import__("os").environ["GITHUB_RUN_ID"])

          raw_patch = patch_path.read_text(encoding="utf-8")
          try:
              updates = {str(key): str(value) for key, value in __import__("json").loads(raw_patch).items()}
          except Exception:
              updates: dict[str, str] = {}
              for raw_line in raw_patch.splitlines():
                  if not raw_line or raw_line.lstrip().startswith("#") or "=" not in raw_line:
                      continue
                  key, value = raw_line.split("=", 1)
                  updates[key] = value

          def render_env_value(value: str) -> str:
              import json
              import re

              if re.fullmatch(r"[A-Za-z0-9_./:@%+-]*", value):
                  return value
              return json.dumps(value, ensure_ascii=False)

          lines = env_path.read_text(encoding="utf-8").splitlines()
          rendered: list[str] = []
          seen: set[str] = set()
          for line in lines:
              stripped = line.lstrip()
              if not stripped.startswith("#") and "=" in line:
                  key, _ = line.split("=", 1)
                  if key in updates:
                      rendered.append(f"{key}={render_env_value(updates[key])}")
                      seen.add(key)
                      continue
              rendered.append(line)

          for key, value in updates.items():
              if key not in seen:
                  rendered.append(f"{key}={render_env_value(value)}")

          env_path.write_text("\n".join(rendered) + "\n", encoding="utf-8")
          env_path.chmod(0o600)
          PY

          rm -f "$ENV_PATCH"
          rm -rf "$PREFLIGHT_DIR"

          # Make the scheduler the single owner of the first post-deploy full
          # governance pass. Preserve the previous cadence stamp for audit,
          # then age the active stamp so the restarted scheduler runs now.
          deploy_started_epoch="$(date -u +%s)"
          governance_stamp="outputs/ops_scheduler/last_governance_refresh"
          $SUDO mkdir -p outputs/ops_scheduler/deploy_stamp_history
          if $SUDO test -f "$governance_stamp"; then
            $SUDO cp -p "$governance_stamp" \
              "outputs/ops_scheduler/deploy_stamp_history/last_governance_refresh.${GITHUB_RUN_ID}"
          fi
          printf '0\n' | $SUDO tee "$governance_stamp" >/dev/null

          echo "[deploy] building and (re)starting stack from $(git rev-parse --short HEAD)"
          if ! $DOCKER compose -f "$COMPOSE_FILE" up -d --build; then
            echo "::warning::Initial compose recreation failed; retrying once from the completed image build."
            sleep 3
            $DOCKER compose -f "$COMPOSE_FILE" up -d --no-build
          fi
          echo "[deploy] enforcing tailnet-only authenticated HTTPS dashboard transport"
          PM_VPS_REPO_DIR="$REPO_DIR" bash scripts/configure_polymarket_dashboard_tailscale.sh
          marker_tmp="outputs/performance/deployed_git_rev.tmp.$$"
          printf '%s\n' "$GITHUB_SHA" > "$marker_tmp"
          mv "$marker_tmp" outputs/performance/deployed_git_rev
          echo "[deploy] refreshing host-observed WO-68 deployment manifest"
          python3 scripts/write_vps_telemetry_manifest.py \
            --repo-root . \
            --output outputs/performance/vps_telemetry_manifest.json

          # Wait for the scheduler-owned full governance job, not merely the
          # early model file. A late-stage failure must make the deploy red.
          model_path="outputs/polymarket_price_action/price_action_model_summary.json"
          governance_complete=false
          governance_failed_code=""
          echo "[deploy] waiting for scheduler-owned post-deploy governance refresh"
          for attempt in $(seq 1 240); do
            governance_result="$(
              DEPLOY_STARTED_EPOCH="$deploy_started_epoch" python3 - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path

          status_path = Path("outputs/ops_scheduler/status.json")
          try:
              payload = json.loads(status_path.read_text(encoding="utf-8"))
          except (OSError, ValueError):
              print("waiting")
              raise SystemExit(0)

          job = payload.get("jobs", {}).get("governance_refresh", {})
          observed = str(job.get("last_run_utc") or "")
          try:
              observed_epoch = int(datetime.fromisoformat(observed.replace("Z", "+00:00")).timestamp())
          except (TypeError, ValueError):
              observed_epoch = 0
          if observed_epoch < int(os.environ["DEPLOY_STARTED_EPOCH"]):
              print("waiting")
          else:
              raw_code = job.get("last_exit_code")
              code = int(raw_code) if raw_code is not None else -1
              print("pass" if code == 0 else f"fail:{code}")
          PY
            )"
            if [ "$governance_result" = "pass" ]; then
              governance_complete=true
              break
            fi
            case "$governance_result" in
              fail:*)
                governance_failed_code="${governance_result#fail:}"
                break
                ;;
            esac
            if [ $((attempt % 12)) -eq 0 ]; then
              stage="$(python3 -c 'import json,pathlib; p=pathlib.Path("outputs/polymarket_model_governance/governance_refresh_status.json"); d=json.loads(p.read_text()) if p.exists() else {}; print(str(d.get("status", "waiting"))+":"+str(d.get("current_stage", "not_started")))' 2>/dev/null || echo waiting:not_started)"
              echo "[deploy] governance progress: $stage"
            fi
            sleep 5
          done
          if [ -n "$governance_failed_code" ]; then
            echo "::error::The scheduler-owned post-deploy governance refresh failed with exit ${governance_failed_code}."
            exit 1
          fi
          if [ "$governance_complete" != true ]; then
            echo "::error::The scheduler did not complete a post-deploy governance refresh within 20 minutes."
            exit 1
          fi
          if [ ! -f "$model_path" ] || [ "$(stat -c %Y "$model_path")" -lt "$deploy_started_epoch" ]; then
            echo "::error::The completed governance refresh did not publish a fresh price-action model."
            exit 1
          fi

          # Exercise the registered component boundaries in a dedicated
          # one-shot container. Stop the recurring scheduler first and prove it
          # is absent, so deploy acceptance has one owner and cannot race a
          # continuous scheduler child. The profiled service contains no
          # broker, signer, cancellation, paper-order, or live-order command.
          echo "[deploy] isolating scheduler and running one-shot real-data acceptance"
          $DOCKER compose -f "$COMPOSE_FILE" stop --timeout 60 vps-ops-scheduler
          running_services="$($DOCKER compose -f "$COMPOSE_FILE" ps --services --status running)"
          if grep -Fxq vps-ops-scheduler <<<"$running_services"; then
            echo "::error::Recurring scheduler remained active; refusing concurrent deploy acceptance."
            exit 1
          fi
          timeout --signal=TERM --kill-after=30s 600 \
            $DOCKER compose -f "$COMPOSE_FILE" --profile deploy-acceptance run \
              --rm --no-deps --no-build vps-deploy-acceptance </dev/null
          $DOCKER compose -f "$COMPOSE_FILE" up -d --no-build vps-ops-scheduler

          # The dashboard renderer is reporting-only. Refresh it after the
          # completed scheduler pass so acceptance and the served cockpit read
          # the same post-deploy evidence generation.
          $DOCKER compose -f "$COMPOSE_FILE" exec -T polymarket-dashboard \
            python scripts/render_polymarket_dashboard.py \
            --config /app/polymarket_predictive_config.example.yaml </dev/null

          acceptance_status="$(python3 -c 'import json; d=json.load(open("outputs/ops_scheduler/deploy_acceptance.json", encoding="utf-8")); print(d.get("status", "FAIL") if d.get("target_deploy_sha") == "'"$GITHUB_SHA"'" else "FAIL")' 2>/dev/null || echo FAIL)"
          if [ "$acceptance_status" != "PASS" ]; then
            echo "::error::WO-79 post-deploy acceptance failed; automatic rollback is armed for $original_head."
            exit 1
          fi

          echo "[deploy] verifying paper stack health"
          PM_VPS_REPO_DIR="$REPO_DIR" bash scripts/check_polymarket_vps_paper.sh

          # Reuse the already parsed and range-checked dotenv value. Re-reading
          # it with grep would reintroduce quotes from valid values such as
          # POLYMARKET_DASHBOARD_PORT="8765".
          port="$dashboard_port"
          html="$(curl -fsS --max-time 10 "http://127.0.0.1:${port}/")"
          data="$(curl -fsS --max-time 10 "http://127.0.0.1:${port}/dashboard_data.json")"

          # With pipefail, `printf | grep -q` can return 141 after grep exits
          # on its first match and closes the pipe. Here-strings preserve the
          # schema assertions without an upstream process that can SIGPIPE.
          grep -Fq -- "Proof status" <<<"$html"
          grep -Fq -- "Evidence funnel" <<<"$html"
          grep -Fq -- "Executor live-ops control plane" <<<"$html"
          grep -Fq -- "profit_target_proof_status" <<<"$data"
          grep -Fq -- "deployment_health" <<<"$data"
          grep -Fq -- "mispricing_alpha_bridge" <<<"$data"
          grep -Fq -- "coverage_by_sport_market" <<<"$data"
          grep -Fq -- "alpha_validated_anchor_rows" <<<"$data"
          grep -Fq -- "sharp_sports_funnel" <<<"$data"
          grep -Fq -- '"executor_status"' <<<"$data"
          grep -Fq -- '"fills_last_24h_raw"' <<<"$data"
          grep -Fq -- '"maker_test_fills_last_24h"' <<<"$data"

          DEPLOY_COMMITTED=true
          echo "VPS deploy verified: ${dashboard_private_url} (tailnet-authenticated HTTPS)"
          REMOTE
