name: Deploy Polymarket VPS Paper

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-polymarket-vps-paper
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Validate deploy secrets
        env:
          PM_VPS_HOST: ${{ secrets.PM_VPS_HOST }}
          PM_VPS_USER: ${{ secrets.PM_VPS_USER }}
          PM_VPS_SSH_PRIVATE_KEY: ${{ secrets.PM_VPS_SSH_PRIVATE_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          SUPERBRU_EMAIL: ${{ secrets.SUPERBRU_EMAIL }}
          SUPERBRU_USERNAME: ${{ secrets.SUPERBRU_USERNAME }}
          SUPERBRU_PASSWORD: ${{ secrets.SUPERBRU_PASSWORD }}
          SUPERBRU_POOL_URL: ${{ secrets.SUPERBRU_POOL_URL }}
        run: |
          set -euo pipefail
          missing=0
          for name in PM_VPS_HOST PM_VPS_USER PM_VPS_SSH_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Repository secret ${name} is required for VPS deployment."
              missing=1
            fi
          done
          if [ -z "${THE_ODDS_API_KEY:-}" ]; then
            echo "::warning::THE_ODDS_API_KEY is not set; sharp-anchor odds fetching will remain disabled on the VPS."
          fi
          if { [ -z "${SUPERBRU_EMAIL:-}" ] && [ -z "${SUPERBRU_USERNAME:-}" ]; } || [ -z "${SUPERBRU_PASSWORD:-}" ] || [ -z "${SUPERBRU_POOL_URL:-}" ]; then
            echo "::warning::SuperBru secrets are incomplete; VPS auto-pick watchdog will deploy but idle until credentials are present."
          fi
          exit "$missing"

      - name: Prepare SSH
        env:
          PM_VPS_HOST: ${{ secrets.PM_VPS_HOST }}
          PM_VPS_PORT: ${{ secrets.PM_VPS_PORT || '22' }}
          PM_VPS_SSH_PRIVATE_KEY: ${{ secrets.PM_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/ssh"
          python3 - <<'PY'
          import os
          from pathlib import Path

          raw_key = os.environ.get("PM_VPS_SSH_PRIVATE_KEY", "")
          # GitHub's UI/API can preserve multiline secrets, but operators sometimes
          # paste literal "\n" sequences. Normalise that into an OpenSSH key file.
          if "\\n" in raw_key and "\n" not in raw_key:
              raw_key = raw_key.replace("\\n", "\n")
          raw_key = raw_key.replace("\r\n", "\n").replace("\r", "\n").strip() + "\n"
          Path(os.environ["RUNNER_TEMP"], "ssh", "vps_key").write_text(raw_key, encoding="utf-8")
          PY
          chmod 600 "$RUNNER_TEMP/ssh/vps_key"
          if ! ssh-keygen -y -f "$RUNNER_TEMP/ssh/vps_key" >/dev/null 2>&1; then
            echo "::error::PM_VPS_SSH_PRIVATE_KEY is present but is not a loadable private key. Store the full private key file, not the .pub public key or a PuTTY .ppk file."
            exit 1
          fi
          ssh-keygen -y -f "$RUNNER_TEMP/ssh/vps_key" > "$RUNNER_TEMP/ssh/vps_key.pub"
          ssh-keyscan -p "$PM_VPS_PORT" -H "$PM_VPS_HOST" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/known_hosts"

      - name: Validate VPS SSH authorization
        env:
          PM_VPS_HOST: ${{ secrets.PM_VPS_HOST }}
          PM_VPS_PORT: ${{ secrets.PM_VPS_PORT || '22' }}
          PM_VPS_USER: ${{ secrets.PM_VPS_USER }}
        run: |
          set -euo pipefail
          if ! ssh \
            -i "$RUNNER_TEMP/ssh/vps_key" \
            -o BatchMode=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -p "$PM_VPS_PORT" \
            "$PM_VPS_USER@$PM_VPS_HOST" \
            "echo VPS_SSH_OK" >/dev/null 2>&1; then
            pub_key="$(cat "$RUNNER_TEMP/ssh/vps_key.pub")"
            echo "::error::The deploy private key is valid, but the VPS rejected it. Add this public key to /home/${PM_VPS_USER}/.ssh/authorized_keys on ${PM_VPS_HOST}: ${pub_key}"
            exit 1
          fi

      - name: Create VPS environment patch
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          SUPERBRU_EMAIL: ${{ secrets.SUPERBRU_EMAIL }}
          SUPERBRU_USERNAME: ${{ secrets.SUPERBRU_USERNAME }}
          SUPERBRU_PASSWORD: ${{ secrets.SUPERBRU_PASSWORD }}
          SUPERBRU_LOGIN_URL: ${{ secrets.SUPERBRU_LOGIN_URL }}
          SUPERBRU_POOL_URL: ${{ secrets.SUPERBRU_POOL_URL }}
          SUPERBRU_PLAYER_NAME: ${{ secrets.SUPERBRU_PLAYER_NAME || 'Danie' }}
          SUPERBRU_POOL_KEYWORDS: ${{ secrets.SUPERBRU_POOL_KEYWORDS || 'Moore Infinity,FIFA WC 26,World Cup 2026' }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          patch_file="$RUNNER_TEMP/polymarket-vps-env.patch"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          keys = [
              "THE_ODDS_API_KEY",
              "SUPERBRU_EMAIL",
              "SUPERBRU_USERNAME",
              "SUPERBRU_PASSWORD",
              "SUPERBRU_LOGIN_URL",
              "SUPERBRU_POOL_URL",
              "SUPERBRU_PLAYER_NAME",
              "SUPERBRU_POOL_KEYWORDS",
          ]
          updates = {key: os.environ[key] for key in keys if os.environ.get(key)}
          updates["PM_VPS_DEPLOYED_SHA"] = os.environ["GITHUB_SHA"]
          Path(os.environ["RUNNER_TEMP"], "polymarket-vps-env.patch").write_text(
              json.dumps(updates, ensure_ascii=False),
              encoding="utf-8",
          )
          PY
          chmod 600 "$patch_file"

      - name: Copy environment patch
        env:
          PM_VPS_HOST: ${{ secrets.PM_VPS_HOST }}
          PM_VPS_PORT: ${{ secrets.PM_VPS_PORT || '22' }}
          PM_VPS_USER: ${{ secrets.PM_VPS_USER }}
        run: |
          set -euo pipefail
          scp \
            -i "$RUNNER_TEMP/ssh/vps_key" \
            -o BatchMode=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -P "$PM_VPS_PORT" \
            "$RUNNER_TEMP/polymarket-vps-env.patch" \
            "$PM_VPS_USER@$PM_VPS_HOST:/tmp/polymarket-vps-env.patch.$GITHUB_RUN_ID"

      - name: Pull, rebuild, and verify VPS paper stack
        env:
          PM_VPS_HOST: ${{ secrets.PM_VPS_HOST }}
          PM_VPS_PORT: ${{ secrets.PM_VPS_PORT || '22' }}
          PM_VPS_USER: ${{ secrets.PM_VPS_USER }}
          PM_VPS_REPO_DIR: ${{ secrets.PM_VPS_REPO_DIR || '~/Claude' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ssh \
            -i "$RUNNER_TEMP/ssh/vps_key" \
            -o BatchMode=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -p "$PM_VPS_PORT" \
            "$PM_VPS_USER@$PM_VPS_HOST" \
            "PM_VPS_HOST='$PM_VPS_HOST' PM_VPS_REPO_DIR='$PM_VPS_REPO_DIR' GITHUB_REPOSITORY='$GITHUB_REPOSITORY' GITHUB_SHA='$GITHUB_SHA' GITHUB_RUN_ID='$GITHUB_RUN_ID' bash -s" <<'REMOTE'
          set -euo pipefail

          REPO_DIR="${PM_VPS_REPO_DIR/#\~/$HOME}"
          COMPOSE_FILE="${PM_VPS_COMPOSE_FILE:-docker-compose.vps-paper.yml}"
          ENV_PATCH="/tmp/polymarket-vps-env.patch.${GITHUB_RUN_ID}"

          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            DOCKER="docker"
          else
            DOCKER="sudo docker"
          fi

          if [ ! -d "$REPO_DIR/.git" ]; then
            git clone "https://github.com/${GITHUB_REPOSITORY}.git" "$REPO_DIR"
          fi

          cd "$REPO_DIR"
          git fetch --prune origin main
          git checkout main
          git pull --ff-only origin main

          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::VPS checked out $(git rev-parse HEAD), expected $GITHUB_SHA"
            exit 1
          fi

          if [ ! -f .env ]; then
            cp .env.vps-paper.example .env
            chmod 600 .env
          fi

          python3 - <<'PY'
          from pathlib import Path

          env_path = Path(".env")
          patch_path = Path("/tmp/polymarket-vps-env.patch." + __import__("os").environ["GITHUB_RUN_ID"])

          raw_patch = patch_path.read_text(encoding="utf-8")
          try:
              updates = {str(key): str(value) for key, value in __import__("json").loads(raw_patch).items()}
          except Exception:
              updates: dict[str, str] = {}
              for raw_line in raw_patch.splitlines():
                  if not raw_line or raw_line.lstrip().startswith("#") or "=" not in raw_line:
                      continue
                  key, value = raw_line.split("=", 1)
                  updates[key] = value

          def render_env_value(value: str) -> str:
              import json
              import re

              if re.fullmatch(r"[A-Za-z0-9_./:@%+-]*", value):
                  return value
              return json.dumps(value, ensure_ascii=False)

          lines = env_path.read_text(encoding="utf-8").splitlines()
          rendered: list[str] = []
          seen: set[str] = set()
          for line in lines:
              stripped = line.lstrip()
              if not stripped.startswith("#") and "=" in line:
                  key, _ = line.split("=", 1)
                  if key in updates:
                      rendered.append(f"{key}={render_env_value(updates[key])}")
                      seen.add(key)
                      continue
              rendered.append(line)

          for key, value in updates.items():
              if key not in seen:
                  rendered.append(f"{key}={render_env_value(value)}")

          env_path.write_text("\n".join(rendered) + "\n", encoding="utf-8")
          env_path.chmod(0o600)
          PY

          python3 - <<'PY'
          import os
          from pathlib import Path

          env_path = Path(".env")
          host = os.environ.get("PM_VPS_HOST", "").strip()
          if host:
              lines = env_path.read_text(encoding="utf-8").splitlines()
              values: dict[str, str] = {}
              for line in lines:
                  stripped = line.strip()
                  if not stripped or stripped.startswith("#") or "=" not in stripped:
                      continue
                  key, value = stripped.split("=", 1)
                  values[key] = value.strip().strip('"').strip("'")
              port = values.get("POLYMARKET_DASHBOARD_PORT") or "8765"
              public_url = f"http://{host}:{port}/"
              rendered: list[str] = []
              wrote = False
              for line in lines:
                  if line.startswith("PM_DASHBOARD_PUBLIC_URL="):
                      rendered.append(f"PM_DASHBOARD_PUBLIC_URL={public_url}")
                      wrote = True
                  else:
                      rendered.append(line)
              if not wrote:
                  rendered.append(f"PM_DASHBOARD_PUBLIC_URL={public_url}")
              env_path.write_text("\n".join(rendered) + "\n", encoding="utf-8")
              env_path.chmod(0o600)
          PY
          rm -f "$ENV_PATCH"

          $DOCKER compose -f "$COMPOSE_FILE" up -d --build

          # Force a governance + dashboard artifact refresh after the code update;
          # the dashboard reads generated governance files such as the proof-first
          # paper_profit_goal_plan, so render-only can leave stale decisions.
          $DOCKER compose -f "$COMPOSE_FILE" exec -T polymarket-paper-live \
            python -m polymarket_predictive_engine.cli refresh-governance \
            --config /app/polymarket_predictive_config.example.yaml

          bash scripts/check_polymarket_vps_paper.sh

          port="$(grep -E '^POLYMARKET_DASHBOARD_PORT=' .env | tail -n 1 | cut -d= -f2-)"
          port="${port:-8765}"
          html="$(curl -fsS --max-time 10 "http://127.0.0.1:${port}/")"
          data="$(curl -fsS --max-time 10 "http://127.0.0.1:${port}/dashboard_data.json")"

          printf '%s' "$html" | grep -q "Proof status"
          printf '%s' "$html" | grep -q "Evidence funnel"
          printf '%s' "$data" | grep -q "profit_target_proof_status"
          printf '%s' "$data" | grep -q "deployment_health"
          printf '%s' "$data" | grep -q "mispricing_alpha_bridge"
          printf '%s' "$data" | grep -q "coverage_by_sport_market"
          printf '%s' "$data" | grep -q "alpha_validated_anchor_rows"
          printf '%s' "$data" | grep -q "sharp_sports_funnel"

          echo "VPS deploy verified: http://${PM_VPS_HOST}:${port}/"
          REMOTE
