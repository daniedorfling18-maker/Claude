name: Independently Reviewed PR Merge

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request number targeting main
        required: true
        type: string
      expected_head_sha:
        description: Exact 40-character PR head SHA reviewed by the operator
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: independent-pr-merge-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  independently-reviewed-merge:
    name: Verify current-head review and merge
    runs-on: [self-hosted, Linux, ARM64, polymarket-ci]
    timeout-minutes: 10
    # Gate this contents:write-capable job behind an Environment whose
    # deployment branches are restricted to `main` (repo Settings -> Environments
    # -> main-merge, "Deployment branches and tags" = Selected -> main). GitHub
    # enforces that restriction server-side, so a workflow_dispatch that selects
    # a candidate branch cannot obtain this job's token even if that branch
    # rewrites this workflow file. Without the Environment configured, the job
    # will not receive protected credentials.
    environment: main-merge

    steps:
      - name: Check out accepted merge utility
        uses: actions/checkout@v6
        with:
          ref: main
          path: merge-utility
          fetch-depth: 0
          persist-credentials: false

      - name: Verify and merge the exact reviewed head
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          # Dispatch inputs arrive ONLY through the environment above; never
          # interpolate ${{ ... }} into this shell. Validate before use so a
          # crafted input cannot inject shell metacharacters on the runner.
          case "$PR_NUMBER" in ''|*[!0-9]*) echo "::error::pr_number must be a positive integer"; exit 1 ;; esac
          case "$EXPECTED_HEAD_SHA" in *[!0-9a-f]*|'') echo "::error::expected_head_sha must be lowercase hex"; exit 1 ;; esac
          [ "${#EXPECTED_HEAD_SHA}" -eq 40 ] || { echo "::error::expected_head_sha must be 40 characters"; exit 1; }
          mkdir -p "$RUNNER_TEMP/independent-main-acceptance"
          docker run --rm --cpus 1 --memory 512m --pids-limit 128 \
            -e GITHUB_TOKEN -e ACTIONS_ID_TOKEN_REQUEST_URL \
            -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            -v "${GITHUB_WORKSPACE}/merge-utility:/src:ro" \
            python:3.11-slim python /src/scripts/merge_independently_reviewed_pr.py \
              --repo daniedorfling18-maker/Claude \
              --pr "$PR_NUMBER" \
              --expected-head "$EXPECTED_HEAD_SHA" \
              --merge | tee "$RUNNER_TEMP/independent-main-acceptance/merge-attestation.json"

      - name: Publish exact-main deployment attestation
        uses: actions/upload-artifact@v7
        with:
          name: independent-main-acceptance-${{ github.run_id }}
          path: ${{ runner.temp }}/independent-main-acceptance/merge-attestation.json
          if-no-files-found: error
          retention-days: 30
