name: Independently Reviewed PR Merge

on:
  # GitHub loads issue_comment workflows from the default branch only. A pull
  # request branch therefore cannot replace this contents:write-capable control
  # and dispatch its own copy.
  issue_comment:
    types: [created]

permissions:
  actions: read
  checks: read
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: independent-pr-merge-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  independently-reviewed-merge:
    name: Verify current-head review and merge
    if: >-
      github.event.issue.pull_request &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      startsWith(github.event.comment.body, '/independent-merge ')
    runs-on: [self-hosted, Linux, ARM64, polymarket-ci]
    timeout-minutes: 10

    steps:
      - name: Check out accepted merge utility
        uses: actions/checkout@v6
        with:
          ref: main
          path: merge-utility
          fetch-depth: 0
          persist-credentials: false

      - name: Verify and merge the exact reviewed head
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          MERGE_COMMAND: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          case "$PR_NUMBER" in ''|*[!0-9]*) echo "::error::PR number must be a positive integer"; exit 1 ;; esac
          [ "$PR_NUMBER" -gt 0 ] || { echo "::error::PR number must be positive"; exit 1; }
          mkdir -p "$RUNNER_TEMP/independent-main-acceptance"
          docker run --rm --cpus 1 --memory 512m --pids-limit 128 \
            -e GITHUB_TOKEN -e ACTIONS_ID_TOKEN_REQUEST_URL \
            -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            -v "${GITHUB_WORKSPACE}/merge-utility:/src:ro" \
            python:3.11-slim python /src/scripts/merge_independently_reviewed_pr.py \
              --repo daniedorfling18-maker/Claude \
              --pr "$PR_NUMBER" \
              --merge-comment "$MERGE_COMMAND" \
              --merge | tee "$RUNNER_TEMP/independent-main-acceptance/merge-attestation.json"

      - name: Publish exact-main deployment attestation
        uses: actions/upload-artifact@v7
        with:
          name: independent-main-acceptance-${{ github.run_id }}
          path: ${{ runner.temp }}/independent-main-acceptance/merge-attestation.json
          if-no-files-found: error
          retention-days: 30
