name: Inspect SuperBru DOM

on:
  workflow_dispatch:
    inputs:
      home_team:
        description: 'Home team name or alias to inspect'
        required: true
        default: 'Spain'
      away_team:
        description: 'Away team name or alias to inspect'
        required: true
        default: 'Saudi Arabia'
      pool_url:
        description: 'SuperBru pool URL (picks view)'
        required: false
        default: 'https://www.superbru.com/worldcup_predictor/pool_view.php?t=1296&p=13236623&view=matches'

permissions:
  contents: read
  actions: read

concurrency:
  group: inspect-superbru-dom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[scraper]"
          python -m playwright install chromium --with-deps

      - name: Run DOM inspector
        env:
          SUPERBRU_EMAIL: ${{ secrets.SUPERBRU_USERNAME }}
          SUPERBRU_PASSWORD: ${{ secrets.SUPERBRU_PASSWORD }}
          SUPERBRU_LOGIN_URL: ${{ secrets.SUPERBRU_LOGIN_URL }}
        run: |
          LOGIN_URL="${SUPERBRU_LOGIN_URL:-https://www.superbru.com/login}"
          python scripts/inspect_superbru_dom_ci.py \
            --email "$SUPERBRU_EMAIL" \
            --password "$SUPERBRU_PASSWORD" \
            --login-url "$LOGIN_URL" \
            --pool-url "${{ github.event.inputs.pool_url }}" \
            --home-team "${{ github.event.inputs.home_team }}" \
            --away-team "${{ github.event.inputs.away_team }}" \
            --headless \
            --out-dir outputs/pregame_checks/submit_diagnostics

      - name: Upload DOM artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: superbru-dom-inspect-${{ github.run_number }}
          path: outputs/pregame_checks/submit_diagnostics/
          retention-days: 3
          if-no-files-found: warn
