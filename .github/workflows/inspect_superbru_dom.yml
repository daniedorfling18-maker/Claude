name: Inspect SuperBru DOM

on:
  workflow_dispatch:
    inputs:
      home_team:
        description: 'Home team name (must match locked picks exactly)'
        required: true
        default: 'Spain'
      away_team:
        description: 'Away team name'
        required: true
        default: 'Saudi Arabia'
      pool_url:
        description: 'SuperBru pool URL (picks view)'
        required: false
        default: 'https://www.superbru.com/worldcup_predictor/pool_view.php?t=1296&p=13236623&g=32&view=matches'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e .
          pip install playwright pandas
          python -m playwright install chromium --with-deps

      - name: Run DOM inspector
        env:
          SUPERBRU_EMAIL: ${{ secrets.SUPERBRU_USERNAME }}
          SUPERBRU_PASSWORD: ${{ secrets.SUPERBRU_PASSWORD }}
        run: |
          python scripts/inspect_superbru_dom_ci.py \
            --email "$SUPERBRU_EMAIL" \
            --password "$SUPERBRU_PASSWORD" \
            --pool-url "${{ github.event.inputs.pool_url }}" \
            --home-team "${{ github.event.inputs.home_team }}" \
            --away-team "${{ github.event.inputs.away_team }}" \
            --headless \
            --out-dir outputs/pregame_checks/submit_diagnostics

      - name: Upload DOM artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: superbru-dom-inspect
          path: outputs/pregame_checks/submit_diagnostics/
          retention-days: 3
