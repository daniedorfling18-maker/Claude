name: Polymarket Mispricing Bot Manual Dry Run

on:
  workflow_dispatch:

concurrency:
  group: polymarket-mispricing-bot
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: Scan Polymarket prices
    runs-on: ubuntu-latest
    timeout-minutes: 6

    env:
      PM_MODE: dry_run
      POLYMARKET_EXECUTE_LIVE: "false"
      POLYMARKET_QUERY: ${{ vars.POLYMARKET_QUERY || 'world cup' }}
      POLYMARKET_EVENT_SLUG: ${{ vars.POLYMARKET_EVENT_SLUG || '' }}
      POLYMARKET_TAG_ID: ${{ vars.POLYMARKET_TAG_ID || '' }}
      POLYMARKET_MIN_EDGE: ${{ vars.POLYMARKET_MIN_EDGE || '0.04' }}
      POLYMARKET_MAX_SPREAD: ${{ vars.POLYMARKET_MAX_SPREAD || '0.04' }}
      POLYMARKET_MAX_ORDER_USD: ${{ vars.POLYMARKET_MAX_ORDER_USD || '5' }}
      POLYMARKET_MIN_ASK_SIZE: ${{ vars.POLYMARKET_MIN_ASK_SIZE || '5' }}
      POLYMARKET_MIN_BID_SIZE: ${{ vars.POLYMARKET_MIN_BID_SIZE || '5' }}
      POLYMARKET_ORDER_TYPE: ${{ vars.POLYMARKET_ORDER_TYPE || 'FOK' }}
      POLYMARKET_MODEL_PROBABILITIES_CSV: inputs/polymarket/model_probabilities.csv
      POLYMARKET_POSITIONS_CSV: inputs/polymarket/positions.csv
      POLYMARKET_OUTPUT_DIR: outputs/polymarket
      POLYMARKET_WINNER_TEMPERATURE: ${{ vars.POLYMARKET_WINNER_TEMPERATURE || '1.35' }}
      LONG_SHORT_MIN_EDGE: ${{ vars.LONG_SHORT_MIN_EDGE || vars.POLYMARKET_MIN_EDGE || '0.04' }}
      LONG_SHORT_STAKE_USDC: ${{ vars.LONG_SHORT_STAKE_USDC || '50' }}
      LONG_SHORT_MAX_LIVE_ORDERS: ${{ vars.LONG_SHORT_MAX_LIVE_ORDERS || '3' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare output directory
        run: mkdir -p outputs/polymarket

      - name: Restore market-making quote history
        uses: actions/cache@v4
        with:
          path: |
            outputs/polymarket/mm_quote_state.csv
            outputs/polymarket/mm_quote_evaluations.csv
            outputs/polymarket/mm_quote_summary.csv
            outputs/polymarket_fixed/worldcup/ml/raw_market_snapshots.csv
            outputs/polymarket_models/calibration_v2.json
            outputs/polymarket_models/category_calibration_v2.json
            outputs/polymarket_models/optimized_model_v1.json
            outputs/polymarket_models/optimized_model_status.json
            work/polymarket/polymarket_engine.sqlite
          key: polymarket-mm-history-${{ github.run_id }}
          restore-keys: |
            polymarket-mm-history-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run pipeline
        run: python scripts/run_polymarket_pipeline.py

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-mispricing-${{ github.run_id }}
          path: |
            outputs/polymarket
            outputs/polymarket_fixed
            outputs/polymarket_models
            outputs/polymarket_predictions
            outputs/polymarket_portfolio
            outputs/polymarket_model_governance
            inputs/polymarket/model_probabilities.csv
          if-no-files-found: ignore
