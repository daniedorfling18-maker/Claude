name: Polymarket VPS Proof Health

on:
  workflow_dispatch:
    inputs:
      stale_after_minutes:
        description: "Fail if dashboard/governance artifacts are older than this many minutes."
        required: false
        default: "480"
      fail_on_bad_proof:
        description: "Fail when proof_questions.status is bad. Leave false during evidence collection."
        required: false
        type: boolean
        default: false
  schedule:
    # Every six hours, shortly after the governance-refresh workflow.
    # This is an operational health/proof check, not a strategy tweak.
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: polymarket-vps-proof-health
  cancel-in-progress: false

jobs:
  proof-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate monitor secrets
        env:
          PM_VPS_HOST: ${{ secrets.PM_VPS_HOST }}
          PM_VPS_USER: ${{ secrets.PM_VPS_USER }}
          PM_VPS_SSH_PRIVATE_KEY: ${{ secrets.PM_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in PM_VPS_HOST PM_VPS_USER PM_VPS_SSH_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Repository secret ${name} is required for VPS proof-health checks."
              missing=1
            fi
          done
          exit "$missing"

      - name: Prepare SSH
        env:
          PM_VPS_HOST: ${{ secrets.PM_VPS_HOST }}
          PM_VPS_PORT: ${{ secrets.PM_VPS_PORT || '22' }}
          PM_VPS_SSH_PRIVATE_KEY: ${{ secrets.PM_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/ssh"
          python3 - <<'PY'
          import os
          from pathlib import Path

          raw_key = os.environ.get("PM_VPS_SSH_PRIVATE_KEY", "")
          if "\\n" in raw_key and "\n" not in raw_key:
              raw_key = raw_key.replace("\\n", "\n")
          raw_key = raw_key.replace("\r\n", "\n").replace("\r", "\n").strip() + "\n"
          Path(os.environ["RUNNER_TEMP"], "ssh", "vps_key").write_text(raw_key, encoding="utf-8")
          PY
          chmod 600 "$RUNNER_TEMP/ssh/vps_key"
          if ! ssh-keygen -y -f "$RUNNER_TEMP/ssh/vps_key" >/dev/null 2>&1; then
            echo "::error::PM_VPS_SSH_PRIVATE_KEY is present but is not a loadable private key."
            exit 1
          fi
          ssh-keyscan -p "$PM_VPS_PORT" -H "$PM_VPS_HOST" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/known_hosts"

      - name: Check VPS proof health
        env:
          PM_VPS_HOST: ${{ secrets.PM_VPS_HOST }}
          PM_VPS_PORT: ${{ secrets.PM_VPS_PORT || '22' }}
          PM_VPS_USER: ${{ secrets.PM_VPS_USER }}
          PM_VPS_REPO_DIR: ${{ secrets.PM_VPS_REPO_DIR || '~/Claude' }}
          EXPECTED_SHA: ${{ github.sha }}
          STALE_AFTER_MINUTES: ${{ github.event.inputs.stale_after_minutes || '480' }}
          FAIL_ON_BAD_PROOF: ${{ github.event.inputs.fail_on_bad_proof || 'false' }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/polymarket-proof-health.md"
          set +e
          ssh \
            -i "$RUNNER_TEMP/ssh/vps_key" \
            -o BatchMode=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=5 \
            -o TCPKeepAlive=yes \
            -o ConnectTimeout=30 \
            -p "$PM_VPS_PORT" \
            "$PM_VPS_USER@$PM_VPS_HOST" \
            "PM_VPS_REPO_DIR='$PM_VPS_REPO_DIR' EXPECTED_SHA='$EXPECTED_SHA' STALE_AFTER_MINUTES='$STALE_AFTER_MINUTES' FAIL_ON_BAD_PROOF='$FAIL_ON_BAD_PROOF' GITHUB_RUN_ID='${GITHUB_RUN_ID:-manual}' bash -s" > "$report" <<'REMOTE'
          set -euo pipefail

          REPO_DIR="${PM_VPS_REPO_DIR/#\~/$HOME}"
          if [ ! -d "$REPO_DIR/.git" ]; then
            echo "::error::VPS repo directory is missing or not a git checkout: $REPO_DIR"
            exit 1
          fi

          cd "$REPO_DIR"
          ACTUAL_SHA="$(git rev-parse HEAD 2>/dev/null || echo unknown)"
          git fetch --quiet origin main || true
          ORIGIN_MAIN_SHA="$(git rev-parse origin/main 2>/dev/null || echo unknown)"
          RUNTIME_DIFF="$(git diff --name-only "$ACTUAL_SHA" "$ORIGIN_MAIN_SHA" -- \
            src \
            scripts \
            polymarket_predictive_config.example.yaml \
            pyproject.toml \
            requirements.txt \
            docker-compose.vps-paper.yml \
            .env.vps-paper.example 2>/dev/null || true)"
          export ACTUAL_SHA ORIGIN_MAIN_SHA RUNTIME_DIFF

          PORT="$(python3 - <<'PY'
          from pathlib import Path

          port = "8765"
          env_path = Path(".env")
          if env_path.exists():
              for line in env_path.read_text(encoding="utf-8", errors="replace").splitlines():
                  stripped = line.strip()
                  if stripped.startswith("POLYMARKET_DASHBOARD_PORT="):
                      raw = stripped.split("=", 1)[1].strip().strip('"').strip("'")
                      port = raw or port
          print(port)
          PY
          )"
          export PORT

          DASHBOARD_JSON="/tmp/polymarket-proof-health-dashboard-${GITHUB_RUN_ID:-manual}.json"
          DASHBOARD_HTML="/tmp/polymarket-proof-health-dashboard-${GITHUB_RUN_ID:-manual}.html"
          curl -fsS --max-time 15 "http://127.0.0.1:${PORT}/dashboard_data.json" > "$DASHBOARD_JSON"
          curl -fsS --max-time 15 "http://127.0.0.1:${PORT}/" > "$DASHBOARD_HTML"

          # Read-only VPS resource diagnostics. 2026-07-07: the deploy workflow's own
          # refresh-governance call took 9+ min (previously under 1 min) before GitHub's
          # 20-min job timeout killed it, and the sharp-odds fetch summary has been frozen
          # for 40+ hours across multiple rebuilds - both point at VPS-level resource
          # contention rather than a code/credentials issue. Every command is best-effort
          # (`|| true`) so a diagnostic hiccup can never fail this health check.
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            DOCKER="docker"
          else
            DOCKER="sudo docker"
          fi
          echo "## VPS resource diagnostics (read-only)"
          echo ""
          echo '```text'
          uptime 2>&1 || true
          echo ""
          free -h 2>&1 || true
          echo ""
          df -h / 2>&1 || true
          echo ""
          $DOCKER ps --format 'table {{.Names}}\t{{.Status}}\t{{.RunningFor}}' 2>&1 || true
          echo ""
          timeout 15 $DOCKER stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}' 2>&1 || true
          echo ""
          # Restart/OOM forensics: a container showing "Up 8 minutes" but created hours
          # ago restarted for a reason; RestartCount + OOMKilled say whether the kernel
          # killed it at its mem_limit (observed 2026-07-07 pre-optimisation, exit 137).
          for name in polymarket-paper-live polymarket-dashboard superbru-auto-pick-watchdog; do
            $DOCKER inspect --format "$name restarts={{.RestartCount}} oom_killed={{.State.OOMKilled}} started={{.State.StartedAt}} exit_code={{.State.ExitCode}}" "$name" 2>&1 || true
          done
          echo '```'
          echo ""

          python3 - "$DASHBOARD_JSON" "$DASHBOARD_HTML" <<'PY'
          from __future__ import annotations

          import json
          import os
          import sys
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from typing import Any

          dashboard_path = Path(sys.argv[1])
          html_path = Path(sys.argv[2])
          repo_root = Path.cwd()
          governance_root = repo_root / "outputs" / "polymarket_model_governance"

          expected_sha = os.environ.get("EXPECTED_SHA", "")
          actual_sha = os.environ.get("ACTUAL_SHA", "")
          origin_main_sha = os.environ.get("ORIGIN_MAIN_SHA", "")
          runtime_diff = [line.strip() for line in os.environ.get("RUNTIME_DIFF", "").splitlines() if line.strip()]
          stale_after_minutes = int(float(os.environ.get("STALE_AFTER_MINUTES") or 480))
          fail_on_bad_proof = str(os.environ.get("FAIL_ON_BAD_PROOF") or "false").lower() == "true"

          errors: list[str] = []
          warnings: list[str] = []

          def load_json(path: Path, *, required: bool = False) -> dict[str, Any]:
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  if required:
                      errors.append(f"Cannot read required JSON artifact {path}: {exc}")
                  else:
                      warnings.append(f"Cannot read optional JSON artifact {path}: {exc}")
                  return {}
              return payload if isinstance(payload, dict) else {}

          def parse_ts(value: Any) -> datetime | None:
              if not value:
                  return None
              text = str(value).strip()
              if not text:
                  return None
              for candidate in (text, text.replace("Z", "+00:00")):
                  try:
                      dt = datetime.fromisoformat(candidate)
                      return dt if dt.tzinfo else dt.replace(tzinfo=timezone.utc)
                  except ValueError:
                      pass
              return None

          def num(value: Any) -> float | None:
              try:
                  if value is None or value == "":
                      return None
                  return float(value)
              except (TypeError, ValueError):
                  return None

          def fmt_num(value: Any, missing: str = "unknown") -> str:
              # Report counts as integers ("280", not "280.0") and rates to 3dp.
              number = num(value)
              if number is None:
                  return missing if value in (None, "") else str(value)
              if float(number).is_integer():
                  return str(int(number))
              return f"{number:.3f}"

          dashboard = load_json(dashboard_path, required=True)
          html = html_path.read_text(encoding="utf-8", errors="replace") if html_path.exists() else ""
          coverage = load_json(governance_root / "sharp_anchor_coverage.json", required=True)
          proof_artifact = load_json(governance_root / "proof_questions.json")
          fetch_summary = load_json(governance_root / "sharp_odds_fetch_summary.json")
          governance_refresh = load_json(governance_root / "governance_refresh.json")

          if actual_sha != origin_main_sha:
              if runtime_diff:
                  errors.append(
                      "VPS is behind origin/main on runtime-relevant files: " + ", ".join(runtime_diff[:20])
                  )
              else:
                  warnings.append(
                      f"VPS SHA differs from origin/main, but only non-runtime files appear to differ: actual={actual_sha}, origin_main={origin_main_sha}"
                  )
          if expected_sha and origin_main_sha and expected_sha != origin_main_sha:
              warnings.append(f"Workflow SHA differs from fetched origin/main: workflow={expected_sha}, origin_main={origin_main_sha}")

          required_dashboard_keys = [
              "deployment_health",
              "mispricing_alpha_bridge",
              "sharp_sports_funnel",
              "sharp_fetch_health",
              "proof_questions",
          ]
          for key in required_dashboard_keys:
              if key not in dashboard:
                  errors.append(f"dashboard_data.json is missing required key: {key}")

          if "proofQuestions" not in html and "Four proof questions" not in html:
              errors.append("dashboard HTML does not expose the four proof questions section")

          sharp_health = dashboard.get("sharp_fetch_health") if isinstance(dashboard.get("sharp_fetch_health"), dict) else {}
          fetch_status = str(
              sharp_health.get("status")
              or sharp_health.get("provider_status")
              or fetch_summary.get("status")
              or fetch_summary.get("provider_status")
              or "unknown"
          )
          fetch_health = str(sharp_health.get("health") or "").lower()
          fetch_rows = num(sharp_health.get("rows") or sharp_health.get("rows_written") or fetch_summary.get("rows_written"))
          requests_remaining = num(sharp_health.get("requests_remaining") or fetch_summary.get("requests_remaining"))

          attention_statuses = {
              "missing_api_key",
              "missing-key",
              "zero_quota",
              "zero-quota",
              "hard_error",
              "provider_error",
              "error",
          }
          if fetch_health == "attention":
              errors.append(f"sharp_fetch_health requires attention: status={fetch_status}, requests_remaining={requests_remaining}")
          if fetch_status.lower() in attention_statuses:
              errors.append(f"sharp odds fetch is not live/healthy: status={fetch_status}")
          if requests_remaining is not None and requests_remaining <= 0:
              errors.append("Odds API quota appears exhausted: requests_remaining <= 0")
          if fetch_status.lower() == "skipped_budget":
              warnings.append("Sharp fetch is currently skipped by fetch-interval budget; this is acceptable if recent provider data exists.")
          if fetch_rows == 0 and fetch_status.lower() not in {"skipped_budget", "fallback_loaded"}:
              warnings.append(f"Sharp fetch wrote zero rows with status={fetch_status}; inspect if this persists.")

          coverage_status = str(coverage.get("status") or "unknown")
          total_fetched = int(num(coverage.get("total_rows_fetched")) or 0)
          total_mapped = int(num(coverage.get("total_rows_mapped")) or 0)
          flagged = int(num(coverage.get("flagged_no_mappable_market_count")) or 0)
          join_rate = (total_mapped / total_fetched) if total_fetched else None
          if coverage_status not in {"ok", "missing_anchor_summary"}:
              errors.append(f"sharp_anchor_coverage status is unexpected: {coverage_status}")
          if flagged > 0:
              # WO-31's no_mappable_market classification is BY SPEC a recommendation
              # string for a human to act on deliberately - never an automatic trim and
              # therefore not an operational failure. Surface it loudly as a warning
              # with the exact pairs named, but do not paint the health check red
              # (that chronic red would train people to ignore real failures).
              flagged_rows = coverage.get("flagged_no_mappable_market")
              flagged_pairs = ", ".join(
                  f"{row.get('sport', '?')}/{row.get('market_key', '?')}"
                  for row in (flagged_rows if isinstance(flagged_rows, list) else [])
                  if isinstance(row, dict)
              ) or "unknown pairs"
              warnings.append(
                  f"WO-31 recommendation: {flagged} sport/market pair(s) mapped zero tokens across the "
                  f"flag threshold ({flagged_pairs}); review whether to trim them from sharp_odds_fetch."
              )
          if total_fetched == 0:
              warnings.append("WO-31 coverage has zero fetched rows; if sharp fetch is live, this needs review after the next fetch cycle.")

          proof = dashboard.get("proof_questions") if isinstance(dashboard.get("proof_questions"), dict) else proof_artifact
          proof_status = str(proof.get("status") or "unknown") if isinstance(proof, dict) else "missing"
          questions = proof.get("questions") if isinstance(proof, dict) else []
          questions = questions if isinstance(questions, list) else []
          if not questions:
              errors.append("proof_questions exists but contains no questions")
          if len(questions) != 4:
              errors.append(f"proof_questions should contain 4 questions; found {len(questions)}")
          if proof_status == "bad" and fail_on_bad_proof:
              errors.append("proof_questions.status is bad and fail_on_bad_proof=true")
          elif proof_status == "bad":
              warnings.append("proof_questions.status is bad, but this check is configured not to fail on strategy evidence during collection.")

          freshness_sources = [
              ("dashboard_data", dashboard.get("generated_at_utc") or dashboard.get("updated_at_utc")),
              ("governance_refresh", governance_refresh.get("generated_at_utc")),
              ("sharp_anchor_coverage", coverage.get("generated_at_utc")),
              ("proof_questions", proof.get("generated_at_utc") if isinstance(proof, dict) else None),
          ]
          now = datetime.now(timezone.utc)
          for label, raw_ts in freshness_sources:
              parsed = parse_ts(raw_ts)
              if parsed is None:
                  warnings.append(f"{label} has no parseable generated timestamp: {raw_ts!r}")
                  continue
              age_minutes = (now - parsed).total_seconds() / 60.0
              if age_minutes > stale_after_minutes:
                  errors.append(f"{label} is stale: age={age_minutes:.1f} minutes > {stale_after_minutes}")

          # Sharp-fetch lane liveness. The artifact checks above cover the dashboard and
          # governance renders, but the loop can keep rendering while the sharp-odds fetch
          # lane silently stalls (observed 2026-07-06/07: summary frozen ~24h at
          # requests_remaining=280 while the shared Odds API quota died elsewhere). A frozen
          # summary also means the requests-remaining figure shown in this report is stale.
          # 480 min = 2.6x the configured 180-min fetch interval.
          fetch_stale_after_minutes = 480
          fetch_age_minutes = None
          fetch_generated = parse_ts(fetch_summary.get("generated_at_utc"))
          if fetch_generated is not None:
              fetch_age_minutes = (now - fetch_generated).total_seconds() / 60.0
              if fetch_age_minutes > fetch_stale_after_minutes:
                  warnings.append(
                      f"sharp_odds_fetch_summary is frozen: age={fetch_age_minutes:.0f} min > {fetch_stale_after_minutes} "
                      "(fetch lane stalled, engine skipping heavy passes, or provider dead; "
                      "requests_remaining above reflects the LAST successful fetch, not now)"
                  )
          elif fetch_summary:
              warnings.append("sharp_odds_fetch_summary has no parseable generated_at_utc; cannot judge fetch-lane liveness")

          # Explicit quota-exhaustion callout: the same key feeds the VPS sharp fetch,
          # auto_pick, refresh-locked-superbru-card, and superbru-clv-snapshot, so when
          # quota dies EVERY odds consumer goes dark at once.
          fetch_error_blob = json.dumps(fetch_summary, default=str)
          if "OUT_OF_USAGE_CREDITS" in fetch_error_blob or "Usage quota has been reached" in fetch_error_blob:
              warnings.append(
                  "Odds API quota exhausted (OUT_OF_USAGE_CREDITS): all shared-key consumers are dark "
                  "(VPS sharp fetch, auto_pick, locked-card refresh, CLV snapshot). "
                  "Upgrade the plan or wait for the monthly reset; the anchor and autopicker cannot fetch until then."
              )

          question_rows = []
          question_severities = {}
          for row in questions:
              if not isinstance(row, dict):
                  continue
              question = str(row.get("question") or "unknown")
              severity = str(row.get("severity") or "unknown")
              question_severities[question] = severity
              question_rows.append(
                  {
                      "question": question,
                      "severity": severity,
                      "answer": row.get("answer"),
                      "key_metric": row.get("key_metric"),
                      "decision_use": row.get("decision_use"),
                  }
              )

          leading_questions = [
              "Sharp-anchor rows mapped?",
              "Dutch-arb persistent opportunities?",
              "Focus-view CLV positive with enough samples?",
          ]
          paper_question = "Audited paper P&L positive after governed probes?"
          snapshot = {
              "generated_at_utc": now.isoformat().replace("+00:00", "Z"),
              "vps_sha": actual_sha,
              "origin_main_sha": origin_main_sha,
              "workflow_sha": expected_sha,
              "runtime_diff": runtime_diff,
              "dashboard_port": os.environ.get("PORT", "unknown"),
              "sharp_fetch_status": fetch_status,
              "sharp_fetch_health": fetch_health or "unknown",
              "odds_api_requests_remaining": requests_remaining,
              "sharp_rows_written_or_fetched": fetch_rows,
              "coverage_status": coverage_status,
              "coverage_total_rows_fetched": total_fetched,
              "coverage_total_rows_mapped": total_mapped,
              "coverage_join_rate": join_rate,
              "coverage_zero_join_flags": flagged,
              "proof_status": proof_status,
              "question_severities": question_severities,
              "questions": question_rows,
              "leading_streams_good_count": sum(1 for key in leading_questions if question_severities.get(key) == "good"),
              "paper_stream_good": question_severities.get(paper_question) == "good",
              "errors": list(errors),
              "warnings": list(warnings),
          }

          proof_health_summary = {"status": "not_written"}
          try:
              governance_root.mkdir(parents=True, exist_ok=True)
              snapshot_path = governance_root / "proof_health_snapshots.jsonl"
              summary_path = governance_root / "proof_health_summary.json"
              with snapshot_path.open("a", encoding="utf-8") as fh:
                  fh.write(json.dumps(snapshot, sort_keys=True, default=str) + "\n")

              all_rows: list[dict[str, Any]] = []
              for raw_line in snapshot_path.read_text(encoding="utf-8", errors="replace").splitlines():
                  if not raw_line.strip():
                      continue
                  try:
                      item = json.loads(raw_line)
                  except json.JSONDecodeError:
                      continue
                  if isinstance(item, dict):
                      all_rows.append(item)

              cutoff = now - timedelta(days=21)
              recent_rows = []
              recent_times = []
              for item in all_rows:
                  parsed = parse_ts(item.get("generated_at_utc"))
                  if parsed is None or parsed < cutoff:
                      continue
                  recent_rows.append(item)
                  recent_times.append(parsed)

              observed_hours = 0.0
              if recent_times:
                  observed_hours = (max(recent_times) - min(recent_times)).total_seconds() / 3600.0

              def count_question(label: str, severity: str) -> int:
                  return sum(
                      1
                      for item in recent_rows
                      if isinstance(item.get("question_severities"), dict)
                      and item["question_severities"].get(label) == severity
                  )

              leading_good_counts = {label: count_question(label, "good") for label in leading_questions}
              leading_warn_counts = {label: count_question(label, "warn") for label in leading_questions}
              leading_bad_counts = {label: count_question(label, "bad") for label in leading_questions}
              zero_join_flag_runs = sum(1 for item in recent_rows if int(item.get("coverage_zero_join_flags") or 0) > 0)
              sharp_attention_runs = sum(1 for item in recent_rows if str(item.get("sharp_fetch_health") or "").lower() == "attention")
              operational_error_runs = sum(1 for item in recent_rows if item.get("errors"))

              if observed_hours < 72:
                  evidence_window_status = "too_early_operational_shakedown"
              elif observed_hours < 336:
                  evidence_window_status = "collecting_market_efficiency_evidence"
              elif observed_hours < 504:
                  evidence_window_status = "waiting_for_three_week_decision_window"
              elif all(count == 0 for count in leading_good_counts.values()):
                  evidence_window_status = "review_stop_or_pivot_no_life_in_leading_streams"
              else:
                  evidence_window_status = "edge_stream_showed_life_continue_evidence_review"

              proof_health_summary = {
                  "status": "ok",
                  "generated_at_utc": snapshot["generated_at_utc"],
                  "decision_use": "market_efficiency_evidence_monitoring_only_not_trade_authorisation",
                  "snapshot_path": str(snapshot_path),
                  "summary_path": str(summary_path),
                  "total_snapshot_count": len(all_rows),
                  "recent_window_days": 21,
                  "recent_snapshot_count": len(recent_rows),
                  "recent_observed_hours": round(observed_hours, 2),
                  "evidence_window_status": evidence_window_status,
                  "leading_good_counts": leading_good_counts,
                  "leading_warn_counts": leading_warn_counts,
                  "leading_bad_counts": leading_bad_counts,
                  "zero_join_flag_runs": zero_join_flag_runs,
                  "sharp_attention_runs": sharp_attention_runs,
                  "operational_error_runs": operational_error_runs,
                  "latest_snapshot": snapshot,
                  "paper_trading_invoked": False,
                  "live_trading_invoked": False,
              }
              summary_path.write_text(json.dumps(proof_health_summary, indent=2, sort_keys=True, default=str) + "\n", encoding="utf-8")
          except Exception as exc:
              errors.append(f"Could not write proof-health snapshot ledger: {exc}")

          print("## Polymarket VPS proof-health check")
          print("")
          print(f"- VPS SHA: `{actual_sha}`")
          print(f"- Origin main SHA: `{origin_main_sha}`")
          print(f"- Workflow SHA: `{expected_sha}`")
          print(f"- Runtime diff count: `{len(runtime_diff)}`")
          print(f"- Dashboard port: `{os.environ.get('PORT', 'unknown')}`")
          print(f"- Sharp fetch status: `{fetch_status}`")
          print(f"- Sharp fetch health: `{fetch_health or 'unknown'}`")
          evidence_freshness = dashboard.get("evidence_freshness") if isinstance(dashboard.get("evidence_freshness"), dict) else {}
          print(f"- Live loop status: `{evidence_freshness.get('live_loop_status', 'unknown')}` (heartbeat age: `{fmt_num(evidence_freshness.get('live_heartbeat_age_seconds'))}`s)")
          print(f"- Sharp fetch summary age: `{fmt_num(fetch_age_minutes, missing='unknown')}` min (generated `{fetch_summary.get('generated_at_utc', 'unknown')}`)")
          print(f"- Odds API requests remaining: `{fmt_num(requests_remaining)}`")
          print(f"- Sharp rows written/fetched: `{fmt_num(fetch_rows)}`")
          print(f"- WO-31 coverage: fetched=`{total_fetched}`, mapped=`{total_mapped}`, join_rate=`{fmt_num(join_rate, missing='n/a')}`, zero_join_flags=`{flagged}`")
          print(f"- Proof status: `{proof_status}`")
          print(f"- Proof-health snapshots: `{proof_health_summary.get('total_snapshot_count', 'unknown')}` total / `{proof_health_summary.get('recent_snapshot_count', 'unknown')}` in 21d")
          print(f"- Evidence window status: `{proof_health_summary.get('evidence_window_status', 'unknown')}`")
          print("")
          print("### Four proof questions")
          for row in questions:
              if not isinstance(row, dict):
                  continue
              print(f"- **{row.get('question', 'unknown')}** — `{row.get('severity', 'unknown')}` — {row.get('key_metric', '-')}")
          verdict = dashboard.get("profit_verdict") if isinstance(dashboard.get("profit_verdict"), dict) else {}
          if verdict:
              print("")
              print("### $100/month verdict (pre-registered gates)")
              print(f"- Verdict: **{verdict.get('verdict', 'unknown')}**")
              for gate_key, gate in (verdict.get("gates") or {}).items():
                  if isinstance(gate, dict):
                      print(f"- {gate_key}: `{gate.get('state', 'unknown')}` — {gate.get('reason', '-')}")
              print(f"- Next evidence: {verdict.get('next_evidence', '-')}")
          if warnings:
              print("")
              print("### Warnings")
              for item in warnings:
                  print(f"- {item}")
          if errors:
              print("")
              print("### Errors")
              for item in errors:
                  print(f"- {item}")
                  print(f"::error::{item}")
              raise SystemExit(1)
          print("")
          print("Status: **healthy / no action required**")
          PY
          REMOTE
          status=$?
          set -e
          cat "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
