name: Refresh Locked Superbru Card

on:
  workflow_dispatch:
  schedule:
    # Twice daily UTC refresh. This updates the committed locked-card CSV only;
    # Auto Pick remains the scheduled browser submitter.
    - cron: '5 6 * * *'    # 08:05 SAST
    - cron: '5 14 * * *'   # 16:05 SAST

permissions:
  contents: write
  actions: read

concurrency:
  group: refresh-locked-superbru-card
  cancel-in-progress: false

jobs:
  refresh-locked-card:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture previous robust card
        run: |
          mkdir -p outputs/daily_robust_card
          if [ -f outputs/daily_robust_card/daily_robust_superbru_card.csv ]; then
            cp outputs/daily_robust_card/daily_robust_superbru_card.csv outputs/daily_robust_card/previous_superbru_card.csv
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[scraper]"
          python -m playwright install --with-deps chromium

      - name: Validate SuperBru login secrets
        env:
          SUPERBRU_EMAIL: ${{ secrets.SUPERBRU_EMAIL }}
          SUPERBRU_USERNAME: ${{ secrets.SUPERBRU_USERNAME }}
          SUPERBRU_PASSWORD: ${{ secrets.SUPERBRU_PASSWORD }}
          SUPERBRU_POOL_URL: ${{ secrets.SUPERBRU_POOL_URL }}
        run: |
          python - <<'PY'
          import os
          missing = []
          if not (os.getenv('SUPERBRU_EMAIL') or os.getenv('SUPERBRU_USERNAME')):
              missing.append('SUPERBRU_EMAIL or SUPERBRU_USERNAME')
          for name in ['SUPERBRU_PASSWORD', 'SUPERBRU_POOL_URL']:
              if not os.getenv(name):
                  missing.append(name)
          if missing:
              raise SystemExit('Missing required SuperBru secret(s): ' + ', '.join(missing))
          print('SuperBru login secrets present: login identity, password and pool URL are configured.')
          PY

      - name: Scrape live SuperBru leaderboard
        env:
          SUPERBRU_EMAIL: ${{ secrets.SUPERBRU_EMAIL }}
          SUPERBRU_USERNAME: ${{ secrets.SUPERBRU_USERNAME }}
          SUPERBRU_PASSWORD: ${{ secrets.SUPERBRU_PASSWORD }}
          SUPERBRU_POOL_URL: ${{ secrets.SUPERBRU_POOL_URL }}
          SUPERBRU_PLAYER_NAME: ${{ secrets.SUPERBRU_PLAYER_NAME || 'Danie' }}
          SUPERBRU_POOL_KEYWORDS: ${{ secrets.SUPERBRU_POOL_KEYWORDS || 'Moore Infinity,FIFA WC 26,World Cup 2026' }}
          PYTHONPATH: scripts:src
        run: |
          python scripts/scrape_superbru_leaderboard.py \
            --out-csv outputs/superbru_pool/live_pool_leaderboard.csv \
            --summary-json outputs/superbru_pool/live_pool_leaderboard_summary.json \
            --headless

      - name: Fetch fresh market odds once
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          PYTHONPATH: src
        run: |
          rm -f outputs/market_odds/worldcup_market_odds_raw.error.json
          mkdir -p outputs/market_odds
          python scripts/fetch_market_odds_theoddsapi.py \
            --sport soccer_fifa_world_cup \
            --regions eu \
            --markets h2h,totals \
            --out-json outputs/market_odds/worldcup_market_odds_raw.json \
            --out-csv outputs/market_odds/worldcup_market_odds_flat.csv \
            --no-allow-stale-on-failure \
            --no-allow-empty-on-failure

      - name: Validate fresh market odds
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          error_path = Path('outputs/market_odds/worldcup_market_odds_raw.error.json')
          if error_path.exists():
              try:
                  report = json.loads(error_path.read_text(encoding='utf-8'))
              except Exception:
                  report = {'raw_error_file': error_path.read_text(encoding='utf-8', errors='replace')}
              raise SystemExit(
                  'The Odds API fetch failed; refusing to commit a stale locked SuperBru card.\n'
                  + json.dumps(report, indent=2)
              )

          flat_path = Path('outputs/market_odds/worldcup_market_odds_flat.csv')
          if not flat_path.exists() or flat_path.stat().st_size == 0:
              raise SystemExit('Fresh market odds CSV is missing or empty.')

          rows = list(csv.DictReader(flat_path.open(encoding='utf-8-sig', newline='')))
          if not rows:
              raise SystemExit('Fresh market odds CSV has headers only; refusing to commit an empty/stale card.')

          commence_times = sorted({row.get('commence_time', '') for row in rows if row.get('commence_time')})
          last_updates = sorted({row.get('last_update', '') for row in rows if row.get('last_update')})
          print(f'Fresh market odds rows: {len(rows)}')
          if commence_times:
              print(f'Fixture window: {commence_times[0]} -> {commence_times[-1]}')
          if last_updates:
              print(f'Bookmaker update window: {last_updates[0]} -> {last_updates[-1]}')
          PY

      - name: Build base final picks from fresh odds and live leaderboard
        env:
          PYTHONPATH: src
        run: |
          mkdir -p data outputs/latest outputs/final_leader_decision_round_summary_profiles outputs/superbru_pool
          python - <<'PY'
          import csv
          from pathlib import Path

          flat_path = Path('outputs/market_odds/worldcup_market_odds_flat.csv')
          fixture_path = Path('data/fixtures_real.csv')
          by_event = {}
          with flat_path.open(encoding='utf-8-sig', newline='') as handle:
              for row in csv.DictReader(handle):
                  event_id = (row.get('event_id') or '').strip()
                  if not event_id or event_id in by_event:
                      continue
                  by_event[event_id] = {
                      'match_id': event_id,
                      'commence_time': row.get('commence_time', ''),
                      'home_team': row.get('home_team', ''),
                      'away_team': row.get('away_team', ''),
                      'neutral': 'true',
                      'venue_country': '',
                      'stage': '',
                  }

          fixtures = sorted(by_event.values(), key=lambda item: item.get('commence_time', ''))
          if not fixtures:
              raise SystemExit('No fixtures could be derived from fresh market odds.')

          fixture_path.parent.mkdir(parents=True, exist_ok=True)
          with fixture_path.open('w', encoding='utf-8', newline='') as handle:
              writer = csv.DictWriter(
                  handle,
                  fieldnames=['match_id', 'commence_time', 'home_team', 'away_team', 'neutral', 'venue_country', 'stage'],
              )
              writer.writeheader()
              writer.writerows(fixtures)
          print(f'Wrote {fixture_path} with {len(fixtures)} fixtures')
          PY

          python -m superbru_score_engine predict \
            --config config.yaml \
            --fixtures data/fixtures_real.csv \
            --odds-json outputs/market_odds/worldcup_market_odds_raw.json \
            --out-dir outputs/latest

          python scripts/run_final_leader_decision.py \
            --fixtures data/fixtures_real.csv \
            --odds-json outputs/market_odds/worldcup_market_odds_raw.json \
            --predictions-csv outputs/latest/predictions.csv \
            --leaderboard-csv outputs/superbru_pool/live_pool_leaderboard.csv \
            --out-dir outputs/final_leader_decision_round_summary_profiles

      - name: Refresh locked card outputs from fetched odds
        env:
          PYTHONPATH: src
        run: |
          rm -f outputs/market_odds/worldcup_market_odds_raw.error.json
          python scripts/run_daily_robust_pipeline.py --skip-final-simulation --skip-market-odds-fetch

      - name: Validate locked card exists
        run: |
          test -s outputs/final_locked_picks/superbru_final_card.csv
          python - <<'PY'
          import csv
          from pathlib import Path
          path = Path('outputs/final_locked_picks/superbru_final_card.csv')
          rows = list(csv.DictReader(path.open(encoding='utf-8-sig')))
          if not rows:
              raise SystemExit('Locked SuperBru card is empty.')
          print(f'Locked SuperBru card rows: {len(rows)}')
          print('First fixture:', rows[0])
          print('Last fixture:', rows[-1])
          PY

      - name: Log pre-match prediction snapshots
        run: |
          python scripts/log_prediction_snapshots.py \
            --flat-odds-csv outputs/market_odds/worldcup_market_odds_flat.csv \
            --log-csv outputs/backtesting/prediction_log.csv

      - name: Upload refresh outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refresh-locked-superbru-card-${{ github.run_number }}
          path: |
            data/fixtures_real.csv
            outputs/latest/*.csv
            outputs/latest/*.json
            outputs/superbru_pool/**/*.csv
            outputs/superbru_pool/**/*.json
            outputs/superbru_pool/**/*.html
            outputs/superbru_pool/**/*.png
            outputs/market_odds/*.csv
            outputs/market_odds/*.json
            outputs/market_odds_validation/*.csv
            outputs/market_odds_validation/*.json
            outputs/market_odds_history/*.csv
            outputs/market_odds_history/*.json
            outputs/component_validation/*.csv
            outputs/component_validation/*.json
            outputs/final_leader_decision_round_summary_profiles/**/*.csv
            outputs/final_leader_decision_round_summary_profiles/**/*.json
            outputs/final_leader_decision_round_summary_profiles/**/*.md
            outputs/final_locked_picks/*.csv
            outputs/final_locked_picks/*.json
            outputs/daily_robust_card/*.csv
            outputs/daily_robust_card/*.json
            outputs/daily_robust_card/*.md
            outputs/final_leader_decision_daily_robust/**/*.csv
            outputs/final_leader_decision_daily_robust/**/*.json
            outputs/backtesting/prediction_log.csv
          if-no-files-found: warn
          retention-days: 7

      - name: Commit refreshed locked card outputs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Refresh locked SuperBru card
          add_options: "-f"
          branch: main
          file_pattern: outputs/final_locked_picks/superbru_final_card.csv
