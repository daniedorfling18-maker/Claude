name: Required PR Gate

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: required-pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard-and-invariants:
    name: WO-69 guard and invariants
    runs-on: [self-hosted, Linux, ARM64, polymarket-ci]
    timeout-minutes: 15
    container:
      image: python:3.11-slim
      options: --cpus 2 --memory 4g

    steps:
      - name: Provision Git before checkout
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
          rm -rf /var/lib/apt/lists/*

      - name: Check out proposed merge
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify provisioned Python
        shell: bash
        run: python -c "import sys; print(sys.version); assert sys.version_info >= (3, 10)"

      - name: Build isolated gate environment
        shell: bash
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install --disable-pip-version-check -e ".[dev]"
          .ci-venv/bin/python -m pip check

      - name: Ruff guard
        shell: bash
        run: .ci-venv/bin/python -m ruff check .

      - name: Validate effective configs
        shell: bash
        run: |
          .ci-venv/bin/python -m polymarket_predictive_engine.cli config-check --config polymarket_predictive_config.example.yaml
          .ci-venv/bin/python -m superbru_score_engine config-check --config config.yaml --profiles calibration_profiles.yaml

      - name: Run full repository suite
        shell: bash
        run: .ci-venv/bin/python -m pytest -q
