name: Required PR Gate

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: required-pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard-and-invariants:
    name: WO-69 guard and invariants
    runs-on: [self-hosted, Linux, ARM64, polymarket-ci]
    timeout-minutes: 30

    steps:
      - name: Check out proposed merge
        uses: actions/checkout@v6
        with:
          path: proposed-merge
          fetch-depth: 0
          persist-credentials: false

      - name: Verify proposed merge checkout
        shell: bash
        run: |
          test "$(git -C "${GITHUB_WORKSPACE}/proposed-merge" rev-parse --is-inside-work-tree)" = "true"
          test -n "$(git -C "${GITHUB_WORKSPACE}/proposed-merge" rev-parse HEAD)"

      - name: Run complete isolated repository gate
        shell: bash
        run: |
          docker run --rm --cpus 2 --memory 4g --pids-limit 512 \
            -v "${GITHUB_WORKSPACE}/proposed-merge:/src:ro" \
            python:3.11-slim sh -euc '
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends git ca-certificates >/dev/null
              cp -a /src/. /worktree
              cd /worktree
              python -m venv /tmp/ci-venv
              /tmp/ci-venv/bin/python -m pip install --disable-pip-version-check -e ".[dev]"
              /tmp/ci-venv/bin/python -m pip check
              /tmp/ci-venv/bin/python -m ruff check .
              /tmp/ci-venv/bin/python -m polymarket_predictive_engine.cli config-check --config polymarket_predictive_config.example.yaml
              /tmp/ci-venv/bin/python -m superbru_score_engine config-check --config config.yaml --profiles calibration_profiles.yaml
              /tmp/ci-venv/bin/python -m pytest -q
            '
