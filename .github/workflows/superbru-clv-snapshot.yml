name: SuperBru CLV snapshot

# CLV-vs-close experiment: snapshot de-vigged World Cup h2h odds on a fixed
# cadence, rebuild the locked-pick history from git, and refresh the CLV
# report. Diagnostic only - stakes nothing. See scripts/superbru_clv_experiment.py.
#
# Budget: one Odds API request per run (eu region, h2h) plus a few billed
# Actions minutes. 2026-07-08: trimmed from every 4 hours to every 8 hours
# after the monthly Actions quota was exhausted; 3 snapshots/day still
# brackets open/close lines for daily fixtures.

on:
  schedule:
    - cron: '30 */8 * * *'
  workflow_dispatch: {}

concurrency:
  group: superbru-clv-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # 2026-07-08: preflight the quota on the free /v4/sports endpoint so an
  # exhausted key produces a clean green skip (with a notice) instead of a red
  # failure on every slot. Proof-health carries the quota alarm.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      have_credits: ${{ steps.quota.outputs.have_credits }}
    steps:
      - name: Check Odds API quota via free sports endpoint
        id: quota
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          set -euo pipefail
          remaining=$(curl -fsS -D - -o /dev/null "https://api.the-odds-api.com/v4/sports/?apiKey=${THE_ODDS_API_KEY}" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-requests-remaining" {print $2}')
          echo "x-requests-remaining=${remaining:-unknown}"
          if awk "BEGIN{exit !((${remaining:-0}) > 0)}"; then
            echo "have_credits=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_credits=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Odds API quota exhausted (x-requests-remaining=${remaining:-0}); skipping the CLV snapshot until credits are available."
          fi

  snapshot:
    needs: preflight
    if: needs.preflight.outputs.have_credits == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # extract-picks walks the full card history

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install engine
        run: pip install -e . --quiet

      - name: Snapshot de-vigged odds
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: python scripts/superbru_clv_experiment.py snapshot

      - name: Rebuild pick history and CLV report
        run: |
          python scripts/superbru_clv_experiment.py extract-picks
          python scripts/superbru_clv_experiment.py report

      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/superbru_clv/
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "Update SuperBru CLV-vs-close evidence"
          git pull --rebase origin main
          git push origin HEAD:main
