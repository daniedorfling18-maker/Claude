# Named calibration profiles for the Superbru score engine.
#
# This file is NOT read by the engine. It is the single source of truth for the
# model-calibration values; run `scripts/select_profile.py` to stamp the active
# profile into config.yaml (the flat file the engine actually reads). This keeps
# calibration reproducible and prevents accidental active-model changes (e.g.
# `copy config.example.yaml config.yaml`).
active_calibration_profile: big5_h2h_totals

calibration_profiles:
  # World-Cup-validated: Football-Data 2014/2018/2022, 1X2 odds only (no totals).
  # Right domain, but not fit on the over/under market you actually pull.
  worldcup_1x2:
    devig_method: power
    dixon_coles_rho: -0.04
    odds_weight: 1.0
    ratings_weight: 0.0

  # Big-Five-league-validated: h2h + totals, 2019/20-2024/25. Right market
  # structure (matches the live h2h,totals feed), but club leagues, not the
  # World Cup. Active until scripts/calibrate_sweep.py picks a data-backed winner.
  big5_h2h_totals:
    devig_method: multiplicative
    dixon_coles_rho: -0.08
    odds_weight: 0.95
    ratings_weight: 0.05
