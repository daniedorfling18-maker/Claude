seed: 20260611

providers:
  # Odds providers (preferred / oddspedia / the_odds_api) must return bookmaker
  # markets (h2h, totals, ...) for the EV model. Result providers
  # (providers.results.*) only need fixtures + scores, so the Oddspedia widget
  # is fine there but must NOT be used as an odds endpoint (it has no markets).
  preferred: oddspedia
  oddspedia:
    api_key_env: ODDSPEDIA_API_TOKEN
    api_key_param: api_token
    # Oddspedia has more than one commercial/feed setup. Configure the JSON
    # endpoint supplied with your account here; the adapter will reject HTML
    # widget responses and allow fallback to The Odds API.
    base_url: ""
    params:
      sport_id: 1
    rate_limit_seconds: 1.0
  the_odds_api:
    api_key_env: THE_ODDS_API_KEY
    sport_key: soccer_fifa_world_cup
    regions: eu,uk,us,au
    markets: h2h,totals
    odds_format: decimal
    rate_limit_seconds: 1.0
  results:
    preferred: oddspedia
    min_commence_time: "2026-06-11T00:00:00Z"
    completed_statuses:
      - 16
      - finished
      - complete
      - completed
      - full-time
      - ft
    oddspedia:
      api_key_env: ODDSPEDIA_API_TOKEN
      api_key_param: api_token
      base_url: "https://widgets.oddspedia.com/api/matches"
      params:
        lang: en
        sport_id: 1
        category_id: 575
        tournament_id: 3
        type: list
        top: ""
      rate_limit_seconds: 1.0

model:
  candidate_grid_goals: 6
  model_grid_goals: 10
  solver_grid_goals: 14
  # Must match a key in calibration_profiles.yaml; run `superbru-score config-check`.
  calibration_profile: worldcup_1x2
  # Calibrated on Football-Data 2014/2018/2022 World Cup 1X2 odds.
  dixon_coles_rho: -0.04
  devig_method: power
  # Set >0 only if your provider/plan returns a correct_score market.
  correct_score_blend_weight: 0.0
  # Ratings still fill gaps when market odds are missing.
  odds_weight: 1.0
  ratings_weight: 0.0
  # Applied only when no market odds are available; odds already price venue/host effects.
  home_advantage_goals: 0.18
  host_teams:
    - United States
    - USA
    - Canada
    - Mexico
  low_data_prior_sigma: 0.25

superbru:
  ci_cutoff: 1.5
  tie_epsilon: 0.005
  contrarian: false
  contrarian_weight: 0.0
  # Superbru scores 90 minutes unless drawn after 90; then it scores after extra time.
  # Penalty shootouts are still scored as draws.
  knockout_result_basis: regular_or_extra_time_if_drawn
  # Strategy layer. Defaults reproduce the raw expected-points pick exactly.
  # strategy_mode: raw_ev | conservative | exact_chase | contrarian | risk_adjusted
  strategy_mode: raw_ev
  exact_chase_weight: 1.0      # >1 tilts the exact_chase pick toward the modal score
  public_pick_weight: 0.0      # alpha: reward EV above the synthetic field EV
  differentiation_weight: 0.0  # delta: reward low synthetic public-pick share
  risk_aversion: 0.0           # beta: penalise P(zero points)
  variance_penalty: 0.0        # gamma: penalise points variance

# Decision-level stress test. These perturb the already-built scoreline matrix
# and strategic decision settings to show how stable the recommended pick is.
sensitivity:
  enabled: true
  lambda_pct: 0.05
  rho_delta: 0.02
  total_goals_delta: 0.15
  public_bias_pct: 0.20
  exact_chase_weights:
    - 1.0
    - 1.5
    - 2.0
  stability_warning_threshold: 0.70

# Ratings/Elo governance. Ratings are intentionally auditable and lower-trust
# than market odds. Keep use_as_fallback_only true unless you have validated the
# blend in a proper backtest.
ratings:
  enabled: true
  source: internal_results_elo
  source_url: ""
  cutoff_date: ""
  update_method: elo_margin_log_multiplier
  k_factor: 24.0
  base_rating: 1500.0
  base_total_goals: 2.45
  elo_goal_scale: 650.0
  min_matches_full_confidence: 8
  use_as_fallback_only: true

betting:
  enabled: false
  min_expected_return: 0.02
  max_kelly_fraction: 0.02
  min_model_probability: 0.55
  max_decimal_odds: 2.10
  match_winners_only: true
  include_draws: false

# SYNTHETIC model of how a Superbru pool likely picks (real picks are never
# visible before lock). Used only by strategic/contrarian overlays, never by the
# default raw-EV pick. Estimates only - not real pool data.
public_pick:
  enabled: true
  favourite_bias: 1.25
  famous_team_bias: 1.15
  clean_sheet_win_bias: 1.10
  draw_penalty: 0.75
  nil_nil_penalty: 0.65
  underdog_penalty: 0.80
  default_template_weight: 0.45
  common_scoreline_weights:
    "1-0": 1.15
    "2-0": 1.30
    "2-1": 1.25
    "1-1": 0.85
    "0-0": 0.60
    "3-0": 1.15
    "0-1": 0.85
    "0-2": 0.75
    "1-2": 0.80
  famous_teams:
    - Brazil
    - Argentina
    - France
    - England
    - Germany
    - Spain
    - Portugal
    - Netherlands
    - Italy
    - United States
    - Mexico

paths:
  cache_dir: work/cache
  ratings_store: work/ratings.json
