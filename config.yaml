seed: 20260611

providers:
  preferred: the_odds_api
  oddspedia:
    api_key_env: ODDSPEDIA_API_TOKEN
    api_key_param: api_token
    base_url: ""
    params:
      sport_id: 1
    rate_limit_seconds: 1.0
  the_odds_api:
    api_key_env: THE_ODDS_API_KEY
    sport_key: soccer_fifa_world_cup
    regions: eu
    markets: h2h,totals
    odds_format: decimal
    rate_limit_seconds: 1.0
  results:
    preferred: oddspedia
    min_commence_time: "2026-06-11T00:00:00Z"
    completed_statuses:
      - 16
      - finished
      - complete
      - completed
      - full-time
      - ft
    oddspedia:
      api_key_env: ODDSPEDIA_API_TOKEN
      api_key_param: api_token
      base_url: "https://widgets.oddspedia.com/api/matches"
      params:
        lang: en
        sport_id: 1
        category_id: 575
        tournament_id: 3
        type: list
        top: ""
      rate_limit_seconds: 1.0

model:
  candidate_grid_goals: 6
  model_grid_goals: 10
  solver_grid_goals: 14
  calibration_profile: big5_h2h_totals
  dixon_coles_rho: -0.08
  devig_method: multiplicative
  # Evidence-derived, not hand-tuned. Set by scripts/validate_correct_score_blend.py:
  # the largest pick-preserving weight (refines private_chase / confidence / sensitivity /
  # defensive signals without overriding any market scoreline) given confirmed Oddspedia
  # grid informativeness. Re-run that harness as results accrue; raise only when the
  # realized-points sweep (Analysis C) justifies override weights. See outputs/blend_validation/.
  correct_score_blend_weight: 0.20
  odds_weight: 1.0
  ratings_weight: 0.0
  asian_handicap_weight: 0.0
  home_advantage_goals: 0.18
  host_teams:
    - United States
    - USA
    - Canada
    - Mexico
  low_data_prior_sigma: 0.25

superbru:
  ci_cutoff: 1.5
  tie_epsilon: 0.005
  contrarian: false
  contrarian_weight: 0.0
  knockout_result_basis: regular_or_extra_time_if_drawn
  strategy_mode: raw_ev
  exact_chase_weight: 1.0
  public_pick_weight: 0.0
  differentiation_weight: 0.0
  risk_aversion: 0.0
  variance_penalty: 0.0
  private_chase_max_ev_loss: 0.05
  private_chase_exact_weight: 1.0
  private_chase_differentiation_weight: 1.0

sensitivity:
  enabled: true
  lambda_pct: 0.05
  rho_delta: 0.02
  total_goals_delta: 0.15
  public_bias_pct: 0.20
  exact_chase_weights:
    - 1.0
    - 1.5
    - 2.0
  stability_warning_threshold: 0.70

ratings:
  enabled: true
  source: internal_results_elo
  source_url: ""
  cutoff_date: ""
  update_method: elo_margin_log_multiplier
  k_factor: 24.0
  base_rating: 1500.0
  base_total_goals: 2.45
  elo_goal_scale: 650.0
  min_matches_full_confidence: 8
  use_as_fallback_only: true

betting:
  enabled: false
  min_expected_return: 0.02
  max_kelly_fraction: 0.02
  min_model_probability: 0.55
  max_decimal_odds: 2.10
  match_winners_only: true
  include_draws: false

public_pick:
  enabled: true
  favourite_bias: 1.25
  famous_team_bias: 1.15
  clean_sheet_win_bias: 1.10
  draw_penalty: 0.75
  nil_nil_penalty: 0.65
  underdog_penalty: 0.80
  default_template_weight: 0.45
  common_scoreline_weights:
    "1-0": 1.15
    "2-0": 1.30
    "2-1": 1.25
    "1-1": 0.85
    "0-0": 0.60
    "3-0": 1.15
    "0-1": 0.85
    "0-2": 0.75
    "1-2": 0.80
  famous_teams:
    - Brazil
    - Argentina
    - France
    - England
    - Germany
    - Spain
    - Portugal
    - Netherlands
    - Italy
    - United States
    - Mexico

paths:
  cache_dir: work/cache
  ratings_store: work/ratings.json
