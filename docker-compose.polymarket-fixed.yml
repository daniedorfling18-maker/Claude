services:
  pm-fixed-monitor:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    container_name: pm-fixed-monitor
    env_file:
      - .env
    environment:
      PM_MODE: dry_run
      POLYMARKET_EXECUTE_LIVE: "false"
      POLYMARKET_QUERY: ${POLYMARKET_QUERY:-world cup}
      POLYMARKET_SCAN_INTERVAL_SECONDS: ${POLYMARKET_SCAN_INTERVAL_SECONDS:-5}
      POLYMARKET_SCAN_SECONDS: ${POLYMARKET_SCAN_SECONDS:-270}
      POLYMARKET_OUTPUT_DIR: ${POLYMARKET_OUTPUT_DIR:-outputs/polymarket}
    volumes:
      - ./outputs:/app/outputs
      - ./inputs/polymarket:/app/inputs/polymarket:ro
    command: ["python", "scripts/polymarket_mispricing_bot.py"]
    restart: unless-stopped

  pm-fixed-converter:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    container_name: pm-fixed-converter
    env_file:
      - .env
    environment:
      POLYMARKET_OUTPUT_DIR: ${POLYMARKET_OUTPUT_DIR:-outputs/polymarket}
      PROBABILITY_CONVERTER_POLL_SECONDS: ${PROBABILITY_CONVERTER_POLL_SECONDS:-5}
    volumes:
      - ./outputs:/app/outputs
      - ./inputs/polymarket:/app/inputs/polymarket
    command: ["python", "scripts/run_probability_converter_loop.py"]
    depends_on:
      - pm-fixed-monitor
    restart: unless-stopped

  pm-fixed-long-short:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    container_name: pm-fixed-long-short
    env_file:
      - .env
    environment:
      PM_MODE: dry_run
      POLYMARKET_EXECUTE_LIVE: "false"
      POLYMARKET_OUTPUT_DIR: ${POLYMARKET_OUTPUT_DIR:-outputs/polymarket}
      LONG_SHORT_POLL_SECONDS: ${LONG_SHORT_POLL_SECONDS:-3}
      LONG_SHORT_MIN_EDGE: ${LONG_SHORT_MIN_EDGE:-0.04}
      LONG_SHORT_MAX_LIVE_ORDERS: ${LONG_SHORT_MAX_LIVE_ORDERS:-3}
    volumes:
      - ./outputs:/app/outputs
      - ./inputs/polymarket:/app/inputs/polymarket:ro
    command: ["python", "scripts/run_long_short_loop.py"]
    depends_on:
      - pm-fixed-monitor
      - pm-fixed-converter
    restart: unless-stopped

  pm-fixed-mm-eval:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    container_name: pm-fixed-mm-eval
    env_file:
      - .env
    environment:
      POLYMARKET_OUTPUT_DIR: ${POLYMARKET_OUTPUT_DIR:-outputs/polymarket}
      MM_EVAL_POLL_SECONDS: ${MM_EVAL_POLL_SECONDS:-10}
    volumes:
      - ./outputs:/app/outputs
      - ./inputs/polymarket:/app/inputs/polymarket:ro
    command: ["python", "scripts/run_market_making_eval_loop.py"]
    depends_on:
      - pm-fixed-long-short
    restart: unless-stopped