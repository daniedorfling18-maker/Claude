services:
  pm-wide-all-monitor:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    container_name: pm-wide-all-monitor
    mem_limit: ${PM_MEM_LIMIT:-512m}
    env_file:
      - .env
    environment:
      PM_MODE: scan
      POLYMARKET_EXECUTE_LIVE: "false"
      POLYMARKET_QUERY: ""
      POLYMARKET_EVENT_LIMIT: "250"
      POLYMARKET_SCAN_INTERVAL_SECONDS: "5"
      POLYMARKET_SCAN_SECONDS: "86400"
      POLYMARKET_OUTPUT_DIR: outputs/polymarket_wide/all
    volumes:
      - ./outputs:/app/outputs
      - ./inputs/polymarket:/app/inputs/polymarket:ro
    command: ["python", "scripts/polymarket_mispricing_bot.py"]
    restart: unless-stopped

  pm-wide-all-ml:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    container_name: pm-wide-all-ml
    mem_limit: ${PM_MEM_LIMIT:-512m}
    env_file:
      - .env
    environment:
      POLYMARKET_OUTPUT_DIR: outputs/polymarket_wide/all
      POLYMARKET_ML_POLL_SECONDS: "5"
    volumes:
      - ./outputs:/app/outputs
      - ./inputs/polymarket:/app/inputs/polymarket:ro
    command: ["python", "scripts/polymarket_ml_collector.py"]
    depends_on:
      - pm-wide-all-monitor
    restart: unless-stopped

