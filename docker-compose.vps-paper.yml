# Lean VPS deployment for the governed Polymarket paper system.
#
# This stack is intentionally small:
#   1. polymarket-paper-live  - continuous websocket paper/evidence loop, paper-only
#   2. polymarket-dashboard   - static oversight dashboard on port 8765
#
# It does NOT start the broad multi-service research stacks and it does NOT enable live trading.
# Copy .env.vps-paper.example to .env, tune the memory/asset limits, then run:
#
#   docker compose -f docker-compose.vps-paper.yml up -d --build
#
services:
  polymarket-paper-live:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_POLYMARKET_SDK: "false"
        INSTALL_SCRAPER: "true"
        PM_IMAGE_BUILD_SHA: ${PM_VPS_DEPLOYED_SHA:-unknown}
    image: polymarket-paper-vps:latest
    container_name: polymarket-paper-live
    mem_limit: ${PM_PAPER_MEM_LIMIT:-4g}
    env_file:
      - .env
    working_dir: /app
    environment:
      PM_MODE: scan
      POLYMARKET_MODE: scan
      POLYMARKET_EXECUTE_LIVE: "false"
      POLYMARKET_LIVE_TRADING: "0"
      POLYMARKET_QUERY: ${POLYMARKET_QUERY:-world cup}
      POLYMARKET_SCAN_QUERY_MODE: ${POLYMARKET_SCAN_QUERY_MODE:-batch}
      POLYMARKET_QUERIES: ${POLYMARKET_QUERIES:-}
      POLYMARKET_MAX_SCAN_QUERIES: ${POLYMARKET_MAX_SCAN_QUERIES:-8}
      POLYMARKET_ADAPTIVE_SCAN_PRIORITY: ${POLYMARKET_ADAPTIVE_SCAN_PRIORITY:-true}
      POLYMARKET_EVENT_LIMIT: ${POLYMARKET_EVENT_LIMIT:-180}
      POLYMARKET_PUBLIC_SEARCH_ENABLED: ${POLYMARKET_PUBLIC_SEARCH_ENABLED:-true}
      POLYMARKET_PUBLIC_SEARCH_LIMIT_PER_TYPE: ${POLYMARKET_PUBLIC_SEARCH_LIMIT_PER_TYPE:-8}
      POLYMARKET_OUTPUT_DIR: ${POLYMARKET_OUTPUT_DIR:-outputs/polymarket}
      POLYMARKET_MODEL_PROBABILITIES_CSV: ${POLYMARKET_MODEL_PROBABILITIES_CSV:-inputs/polymarket/model_probabilities.csv}
      POLYMARKET_POSITIONS_CSV: ${POLYMARKET_POSITIONS_CSV:-inputs/polymarket/positions.csv}
      POLYMARKET_MIN_EDGE: ${POLYMARKET_MIN_EDGE:-0.04}
      THE_ODDS_API_KEY: ${THE_ODDS_API_KEY:-}
      PAPER_LOOP_ITERATIONS: "0"
      POLYMARKET_LIVE_LOOP_SLEEP_SECONDS: ${POLYMARKET_LIVE_LOOP_SLEEP_SECONDS:-1}
      POLYMARKET_WEBSOCKET_SECONDS: ${POLYMARKET_WEBSOCKET_SECONDS:-30}
      POLYMARKET_DISCOVERY_CYCLE_SECONDS: ${POLYMARKET_DISCOVERY_CYCLE_SECONDS:-300}
      PAPER_PREDICTION_CYCLE_SECONDS: ${PAPER_PREDICTION_CYCLE_SECONDS:-30}
      POLYMARKET_PREDICTION_MODE: ${POLYMARKET_PREDICTION_MODE:-paper-bridge}
      POLYMARKET_GOVERNANCE_REFRESH_SECONDS: ${POLYMARKET_GOVERNANCE_REFRESH_SECONDS:-120}
      POLYMARKET_PREDICTION_GOVERNANCE_BLOCK_SECONDS: ${POLYMARKET_PREDICTION_GOVERNANCE_BLOCK_SECONDS:-90}
      POLYMARKET_DISCOVERY_GOVERNANCE_BLOCK_SECONDS: ${POLYMARKET_DISCOVERY_GOVERNANCE_BLOCK_SECONDS:-90}
      POLYMARKET_DISCOVERY_MAX_RUNTIME_SECONDS: ${POLYMARKET_DISCOVERY_MAX_RUNTIME_SECONDS:-900}
      POLYMARKET_PREDICTION_MAX_RUNTIME_SECONDS: ${POLYMARKET_PREDICTION_MAX_RUNTIME_SECONDS:-600}
      POLYMARKET_GOVERNANCE_MAX_RUNTIME_SECONDS: ${POLYMARKET_GOVERNANCE_MAX_RUNTIME_SECONDS:-600}
      POLYMARKET_WEBSOCKET_MAX_ASSETS: ${POLYMARKET_WEBSOCKET_MAX_ASSETS:-180}
      PYTHONDONTWRITEBYTECODE: "1"
    command: >
      sh -c "python scripts/run_polymarket_local_live_loop.py
      --config /app/polymarket_predictive_config.example.yaml
      --iterations $${PAPER_LOOP_ITERATIONS}
      --websocket-seconds $${POLYMARKET_WEBSOCKET_SECONDS}
      --sleep-seconds $${POLYMARKET_LIVE_LOOP_SLEEP_SECONDS}
      --prediction-cycle-seconds $${PAPER_PREDICTION_CYCLE_SECONDS}
      --prediction-mode $${POLYMARKET_PREDICTION_MODE}
      --discovery-cycle-seconds $${POLYMARKET_DISCOVERY_CYCLE_SECONDS}
      --governance-refresh-seconds $${POLYMARKET_GOVERNANCE_REFRESH_SECONDS}
      --prediction-governance-block-seconds $${POLYMARKET_PREDICTION_GOVERNANCE_BLOCK_SECONDS}
      --discovery-governance-block-seconds $${POLYMARKET_DISCOVERY_GOVERNANCE_BLOCK_SECONDS}
      --discovery-max-runtime-seconds $${POLYMARKET_DISCOVERY_MAX_RUNTIME_SECONDS}
      --prediction-max-runtime-seconds $${POLYMARKET_PREDICTION_MAX_RUNTIME_SECONDS}
      --governance-max-runtime-seconds $${POLYMARKET_GOVERNANCE_MAX_RUNTIME_SECONDS}
      --max-assets $${POLYMARKET_WEBSOCKET_MAX_ASSETS}
      --paper-source websocket
      --optimize-model"
    volumes:
      - ./polymarket_predictive_config.example.yaml:/app/polymarket_predictive_config.example.yaml:ro
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - ./outputs:/app/outputs
      - ./work:/app/work
      - ./inputs/polymarket:/app/inputs/polymarket
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /app/outputs/polymarket_model_governance/local_live_loop_heartbeat.json || test -f /app/outputs/polymarket_model_governance/forward_paper_cycle.json",
        ]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 180s

  polymarket-dashboard:
    image: polymarket-paper-vps:latest
    container_name: polymarket-dashboard
    mem_limit: ${PM_DASHBOARD_MEM_LIMIT:-256m}
    env_file:
      - .env
    working_dir: /app
    command: >
      sh -c "mkdir -p /app/outputs/polymarket_dashboard &&
      python scripts/render_polymarket_dashboard.py --config /app/polymarket_predictive_config.example.yaml || true;
      python scripts/serve_polymarket_dashboard.py
      --directory /app/outputs/polymarket_dashboard
      --host 0.0.0.0
      --port 8765"
    ports:
      - "${POLYMARKET_DASHBOARD_HOST:-0.0.0.0}:${POLYMARKET_DASHBOARD_PORT:-8765}:8765"
    volumes:
      - ./polymarket_predictive_config.example.yaml:/app/polymarket_predictive_config.example.yaml:ro
      - ./scripts:/app/scripts:ro
      - ./src:/app/src:ro
      - ./outputs:/app/outputs
      - ./work:/app/work:ro
      - ./inputs/polymarket:/app/inputs/polymarket:ro
    depends_on:
      polymarket-paper-live:
        condition: service_started
    restart: unless-stopped

  superbru-auto-pick-watchdog:
    image: polymarket-paper-vps:latest
    container_name: superbru-auto-pick-watchdog
    mem_limit: ${SUPERBRU_AUTO_PICK_MEM_LIMIT:-1g}
    env_file:
      - .env
    working_dir: /app
    environment:
      SUPERBRU_AUTO_PICK_ENABLED: ${SUPERBRU_AUTO_PICK_ENABLED:-true}
      SUPERBRU_AUTO_PICK_INTERVAL_SECONDS: ${SUPERBRU_AUTO_PICK_INTERVAL_SECONDS:-900}
      SUPERBRU_AUTO_PICK_WINDOW_MINUTES: ${SUPERBRU_AUTO_PICK_WINDOW_MINUTES:-5000}
      SUPERBRU_AUTO_PICK_REVISION_WINDOW_MINUTES: ${SUPERBRU_AUTO_PICK_REVISION_WINDOW_MINUTES:-260}
      SUPERBRU_AUTO_PICK_TIMEOUT_SECONDS: ${SUPERBRU_AUTO_PICK_TIMEOUT_SECONDS:-1500}
      SUPERBRU_AUTO_PICK_OUT_DIR: ${SUPERBRU_AUTO_PICK_OUT_DIR:-outputs/pregame_checks/auto_pick_vps}
      SUPERBRU_LOGIN_URL: ${SUPERBRU_LOGIN_URL:-https://www.superbru.com/login}
      SUPERBRU_POOL_URL: ${SUPERBRU_POOL_URL:-}
      SUPERBRU_PAGE_TIMEZONE: ${SUPERBRU_PAGE_TIMEZONE:-Africa/Johannesburg}
      SUPERBRU_PLAYER_NAME: ${SUPERBRU_PLAYER_NAME:-Danie}
      SUPERBRU_POOL_KEYWORDS: ${SUPERBRU_POOL_KEYWORDS:-Moore Infinity,FIFA WC 26,World Cup 2026}
      THE_ODDS_API_KEY: ${THE_ODDS_API_KEY:-}
    command: sh -c "sh scripts/run_superbru_auto_pick_watchdog.sh"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./scripts:/app/scripts:ro
      - ./src:/app/src:ro
      - ./outputs:/app/outputs
      - ./work:/app/work
      - ./inputs:/app/inputs:ro
    depends_on:
      polymarket-paper-live:
        condition: service_started
    restart: unless-stopped
