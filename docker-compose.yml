services:
  polymarket-agent:
    build:
      context: .
      args:
        INSTALL_POLYMARKET_SDK: ${INSTALL_POLYMARKET_SDK:-false}
    container_name: polymarket-agent
    env_file:
      - .env
    environment:
      PM_MODE: ${PM_MODE:-dry_run}
      POLYMARKET_EXECUTE_LIVE: ${POLYMARKET_EXECUTE_LIVE:-false}
      POLYMARKET_QUERY: ${POLYMARKET_QUERY:-world cup}
      POLYMARKET_SCAN_INTERVAL_SECONDS: ${POLYMARKET_SCAN_INTERVAL_SECONDS:-5}
      POLYMARKET_SCAN_SECONDS: ${POLYMARKET_SCAN_SECONDS:-270}
      POLYMARKET_OUTPUT_DIR: ${POLYMARKET_OUTPUT_DIR:-outputs/polymarket}
    volumes:
      - ./outputs:/app/outputs
      - ./inputs/polymarket:/app/inputs/polymarket:ro
    restart: unless-stopped

  websocket-live-features:
    build:
      context: .
      args:
        INSTALL_POLYMARKET_SDK: ${INSTALL_POLYMARKET_SDK:-false}
    container_name: polymarket-websocket-live-features
    env_file:
      - .env
    working_dir: /app
    command: >
      sh -c "polymarket-engine collect-websocket --config /app/polymarket_predictive_config.example.yaml --websocket-seconds 300 && polymarket-engine refresh-live-features --config /app/polymarket_predictive_config.example.yaml"
    volumes:
      - ./polymarket_predictive_config.example.yaml:/app/polymarket_predictive_config.example.yaml:ro
      - ./outputs:/app/outputs
      - ./inputs/polymarket:/app/inputs/polymarket:ro
    restart: unless-stopped

  polymarket-paper-bot:
    build:
      context: .
      args:
        INSTALL_POLYMARKET_SDK: "false"
    container_name: polymarket-paper-bot
    env_file:
      - .env
    working_dir: /app
    environment:
      PM_MODE: scan
      POLYMARKET_MODE: scan
      POLYMARKET_EXECUTE_LIVE: "false"
      POLYMARKET_LIVE_TRADING: "0"
      POLYMARKET_QUERY: ${POLYMARKET_QUERY:-world cup}
      POLYMARKET_SCAN_QUERY_MODE: ${POLYMARKET_SCAN_QUERY_MODE:-batch}
      POLYMARKET_QUERIES: ${POLYMARKET_QUERIES:-}
      POLYMARKET_MAX_SCAN_QUERIES: ${POLYMARKET_MAX_SCAN_QUERIES:-3}
      POLYMARKET_ADAPTIVE_SCAN_PRIORITY: ${POLYMARKET_ADAPTIVE_SCAN_PRIORITY:-true}
      POLYMARKET_EVENT_LIMIT: ${POLYMARKET_EVENT_LIMIT:-500}
      POLYMARKET_PUBLIC_SEARCH_ENABLED: ${POLYMARKET_PUBLIC_SEARCH_ENABLED:-true}
      POLYMARKET_PUBLIC_SEARCH_LIMIT_PER_TYPE: ${POLYMARKET_PUBLIC_SEARCH_LIMIT_PER_TYPE:-10}
      POLYMARKET_EVENT_SLUG: ${POLYMARKET_EVENT_SLUG:-}
      POLYMARKET_TAG_ID: ${POLYMARKET_TAG_ID:-}
      POLYMARKET_OUTPUT_DIR: ${POLYMARKET_OUTPUT_DIR:-outputs/polymarket}
      POLYMARKET_MODEL_PROBABILITIES_CSV: ${POLYMARKET_MODEL_PROBABILITIES_CSV:-inputs/polymarket/model_probabilities.csv}
      POLYMARKET_POSITIONS_CSV: ${POLYMARKET_POSITIONS_CSV:-inputs/polymarket/positions.csv}
      POLYMARKET_MIN_EDGE: ${POLYMARKET_MIN_EDGE:-0.04}
      THE_ODDS_API_KEY: ${THE_ODDS_API_KEY:-}
      PAPER_LOOP_ITERATIONS: ${PAPER_LOOP_ITERATIONS:-0}
      PAPER_LOOP_SLEEP_SECONDS: ${PAPER_LOOP_SLEEP_SECONDS:-1}
      POLYMARKET_WEBSOCKET_SECONDS: ${POLYMARKET_WEBSOCKET_SECONDS:-10}
      POLYMARKET_DISCOVERY_CYCLE_SECONDS: ${POLYMARKET_DISCOVERY_CYCLE_SECONDS:-180}
      PAPER_PREDICTION_CYCLE_SECONDS: ${PAPER_PREDICTION_CYCLE_SECONDS:-60}
      POLYMARKET_WEBSOCKET_MAX_ASSETS: ${POLYMARKET_WEBSOCKET_MAX_ASSETS:-250}
      PYTHONDONTWRITEBYTECODE: "1"
    command: >
      sh -c "python scripts/run_polymarket_local_live_loop.py
      --config /app/polymarket_predictive_config.example.yaml
      --iterations $${PAPER_LOOP_ITERATIONS}
      --websocket-seconds $${POLYMARKET_WEBSOCKET_SECONDS}
      --sleep-seconds $${PAPER_LOOP_SLEEP_SECONDS}
      --prediction-cycle-seconds $${PAPER_PREDICTION_CYCLE_SECONDS}
      --discovery-cycle-seconds $${POLYMARKET_DISCOVERY_CYCLE_SECONDS}
      --max-assets $${POLYMARKET_WEBSOCKET_MAX_ASSETS}
      --paper-source websocket
      --optimize-model"
    volumes:
      - ./polymarket_predictive_config.example.yaml:/app/polymarket_predictive_config.example.yaml:ro
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - ./outputs:/app/outputs
      - ./work:/app/work
      - ./inputs/polymarket:/app/inputs/polymarket
    restart: unless-stopped

  polymarket-dashboard:
    image: repo-polymarket-paper-bot
    container_name: polymarket-dashboard
    working_dir: /app/outputs/polymarket_dashboard
    command: python -m http.server 8765 --bind 0.0.0.0
    ports:
      - "${POLYMARKET_DASHBOARD_HOST:-0.0.0.0}:${POLYMARKET_DASHBOARD_PORT:-8765}:8765"
    volumes:
      - ./outputs/polymarket_dashboard:/app/outputs/polymarket_dashboard:ro
    restart: unless-stopped
