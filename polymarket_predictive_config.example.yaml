runtime_resource_guard:
  enabled: true
  # 2026-07-07: 99 -> 90, and the guard is now container/cgroup-aware. At 99 the guard
  # effectively never fired: it read HOST memory (~69% used) while the paper-live
  # container sat at 78% of its own 4GiB cgroup cap, swap-thrashing the whole VPS
  # (load ~2.9, 431MiB swap). Degrading heavy passes at 90% keeps iterations fast so
  # the time-critical sharp-anchor evidence lanes keep firing.
  max_memory_percent: 90
  degraded_max_websocket_assets: 20
  skip_prediction_on_high_memory: true
  skip_discovery_on_high_memory: true
  allow_degraded_fast_updown_refresh: true
  allow_degraded_websocket_prediction_refresh: true
  degraded_prediction_cycle_seconds: 60
  prediction_cycle_lock_stale_seconds: 1800
  render_dashboard_on_skip: true
runtime_schedule:
  full_scan_every_iterations: 2
  # 2026-07-07: the three ML trainers (optimize/alpha/edge-search) are staggered
  # (10/12/14) instead of all colliding on the same every-12th iteration, and the loop
  # defers all three past the first iteration after a (re)start. A restart previously
  # fired full scan + all trainers at once on iteration 1, pegging the single VPS core
  # for 10-20 minutes (stale dashboards/model scoring, deploy verifies timing out).
  optimize_model_every_iterations: 10
  # 2026-07-07: sharp fetch/anchor 12 -> 2 (every full-scan iteration). The every-12th
  # iteration gate assumed fast iterations; under VPS load one iteration can crawl to
  # hours, which stretched "every 12 iterations" into DAYS and froze the sharp-fetch
  # lane for 40+ hours - starving the one evidence stream that decides the $100/month
  # question before the 2026-07-19 WC final. Real rate limiting belongs to (and stays
  # with) sharp_odds_fetch.fetch_interval_minutes (180); a budget-skipped attempt is
  # cheap and rewrites the summary so freshness monitoring stays truthful.
