paths:
  data_root: .
  output_root: outputs
  database_path: work/polymarket/polymarket_engine.sqlite
categories:
- all
- bitcoin
- crypto
- election
- fed
- finance
- soccer
- sports
- trump
- worldcup
file_discovery:
  patterns:
  - outputs/polymarket_wide/**/*
  - outputs/polymarket_fixed/**/*
schema:
  timestamp_fields:
  - snapshot_timestamp
  - timestamp
  - collected_at
  - updated_at
  market_id_fields:
  - market_id
  - condition_id
  - id
  - market_slug
  - slug
  token_id_fields:
  - token_id
  - asset_id
  - outcome_token_id
  required_raw_fields:
