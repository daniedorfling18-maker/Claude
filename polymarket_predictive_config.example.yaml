  # If model governance asks for fresh validation examples in a cohort that is
  # not part of the static query list, inject that query into the live scan
  # universe instead of silently starving the model of the evidence it needs.
  inject_research_focus_queries: true
  research_focus_validation_gap_priority_value: 50.0
  research_focus_reserve_enabled: true
