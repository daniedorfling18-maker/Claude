paths:
  data_root: .
  output_root: outputs
  database_path: work/polymarket/polymarket_engine.sqlite
categories:
- all
- bitcoin
- crypto
- election
- fed
- finance
- soccer
- sports
- trump
- worldcup
file_discovery:
  patterns:
  - outputs/polymarket_wide/**/*
  - outputs/polymarket_fixed/**/*
schema:
  timestamp_fields:
  - snapshot_timestamp
  - timestamp
  - collected_at
  - updated_at
  market_id_fields:
  - market_id
  - condition_id
  - id
  - market_slug
  - slug
  token_id_fields:
  - token_id
  - asset_id
  - outcome_token_id
  required_raw_fields:
  - snapshot_timestamp
  - market_id
  - token_id
prediction_horizons:
  hours_before_close:
  - 1
  - 6
  - 24
  - 72
  - 168
  include_all_valid_snapshots: true
freshness_thresholds:
  collector_stale_minutes: 60
  latest_snapshot_stale_minutes: 30
resolution:
  gamma_base_url: https://gamma-api.polymarket.com/markets
  request_timeout_seconds: 20
  request_pause_seconds: 0.05
  max_markets: 250
  settlement_win_threshold: 0.98
  settlement_loss_threshold: 0.02
historical_backfill:
  gamma_base_url: https://gamma-api.polymarket.com/markets
  # 2026-07-10: 250 -> 1000/day. The WO-42 calibration study and WO-43 drift
  # scan are corpus-bound; at 250/day the resolved corpus reaches useful bin
  # depth in months, at 1000/day in weeks. ~10 extra key-less Gamma pages/day.
  max_closed_markets: 1000
  page_size: 100
  request_timeout_seconds: 30
  request_pause_seconds: 0.1
  gamma_query_params: {}
  max_age_days: 365
# 2026-07-09: public data-API executed-trade prints (price/size/aggressor side)
# for the markets the websocket collector already tracks. Free, key-less.
# Signed flow is training substrate for WO-33; collection only, never trades.
trade_prints:
  enabled: true
  base_url: https://data-api.polymarket.com
  max_markets: 60
  limit_per_market: 500
  request_timeout_seconds: 20
  max_ledger_rows: 200000
  open_interest_enabled: true
  # 2026-07-10 WO-54: one-shot deep /trades backfill for maker-study
  # candidates and quote-sheet portfolio. Collection only; no gates/orders.
  backfill_max_prints_per_market: 5000
  backfill_limit_per_page: 500
  backfill_request_pause_seconds: 0.1
# 2026-07-10 WO-37: collection-only wallet intelligence. Leaderboard +
# holder snapshots are raw alpha substrate for later leakage-reviewed feature
# work; this block never feeds gates or order paths directly.
wallet_intelligence:
  enabled: true
  base_url: https://data-api.polymarket.com
  max_markets: 40
  top_holders_per_market: 20
  leaderboard_limit: 100
  # 2026-07-11 WO-58: production trader leaderboard is /v1/leaderboard;
  # legacy /leaderboard remains a fail-soft fallback.
  leaderboard_paths: [/v1/leaderboard, /leaderboard]
  request_timeout_seconds: 20
  max_ledger_rows: 200000
# 2026-07-09 WO-36: maker-carry actuarial study. Measures (never trades) whether
# zero-fee quoting for daily liquidity rewards clears $100/month net of a
# pick-off charge estimated from 1-min price history. Free key-less endpoints.
maker_carry_study:
  enabled: true
  universe_pages: 5
  page_size: 100
  min_daily_pot_usd: 25
  # 2026-07-09: 20 -> 40. Funding is deferred to post-WC, so measurement
  # breadth is the cheapest information available (~30 extra key-less calls
  # per day); mid-tier pots with thin competition are exactly where a small
  # maker's share is largest.
  max_book_candidates: 40
  # 2026-07-11 WO-56: pre-screen up to this many rewarded markets by
  # achievable gross at min quote size before expensive history/markout
  # measurement. Coverage only; registered maker gates remain unchanged.
  yield_scan_max_markets: 200
  # Swept per market; the row keeps the net-carry-maximising fraction.
  quote_distance_fractions: [0.25, 0.5, 0.75]
  reaction_minutes: 1
  capital_cap_usd: 500
  target_net_usd_per_day: 3.33
  # 2026-07-11 WO-57: supplementary bankroll planning only. These caps do
  # not change the registered $500 maker metric or any M-gate input.
  capital_curve_enabled: true
  capital_curve_caps_usd: [250, 500, 1000, 2000, 5000]
  # WO-36 step 2 (2026-07-09): empirical markout charge from executed prints
  # + pre-registered maker gates (M-A needs 7 daily runs at target) + a daily
  # human quote sheet. Measurement only - the system never places orders.
  markout_horizon_minutes: 5
  markout_min_prints: 20
  min_daily_payout_usd: 1.0
  gate_min_runs_at_target: 7
  # 2026-07-10 WO-46: published liquidity-reward share model. It aggregates
  # market + complement books, applies the c=3 single-sided rule inside the
  # eligible mid band, and mechanically excludes rows outside [0.10, 0.90].
  share_model_c: 3.0
  share_model_mid_band_min: 0.10
  share_model_mid_band_max: 0.90
  # 2026-07-10 WO-45: supplementary maker income, reported only. These
  # rebate/holding estimates are explicitly excluded from net carry and gates.
  holding_reward_apr: 0.04
  fee_rate_by_type:
    sports_fees_v2: 0.05
  fee_rate_when_enabled_unknown: 0.07
  maker_rebate_share_by_fee_type:
    sports_fees_v2: 0.15
  maker_rebate_share_when_enabled_unknown: 0.25
# 2026-07-10 WO-40: replay maker quote fills against recorded websocket
# book states + trade prints. Measurement only; does not alter WO-36 charges
# automatically.
maker_fill_replay:
  enabled: true
  max_markets: 10
  replay_days: 7
  # 2026-07-10 WO-44: replay official CLOB orderbook-history alongside the
  # recorded websocket archive when available. Official endpoint failures
  # degrade to the archive source; this remains measurement-only.
  book_source: both
  official_book_limit: 1000
  official_book_max_pages_per_market: 20
  max_official_book_rows: 200000

# 2026-07-10 WO-49: flow-toxicity conditioning for maker quote sheets.
# Measurement only; does not alter adverse charges, gates, sizing, or orders.
flow_toxicity:
  enabled: true
  volume_bucket_usd: 500
  buckets: 50
  markout_horizon_minutes: 5

# 2026-07-12 WO-66: keyless/read-only human execution assistant. It reads
# quote tickets plus websocket/flow/public-resolution state and can only emit
# quotes_ok / requote_advised / pull_quotes_now / STOP. Overrides are clamped
# tighten-only; no auth, signing, placement, amendment, or cancellation path.
requote_alerts:
  enabled: true
  scheduled_event_hours: 24
  max_live_quote_age_seconds: 1800
  mid_drift_distance_multiple: 1.0
  toxicity_threshold: 0.9
  query_resolution_status: true
  request_timeout_seconds: 10
  # WO-77: one public /books batch per alert cycle repairs missing websocket
  # coverage. The hard token cap is tighten-only and excess markets stay
  # fail-closed rather than creating an unbounded poller.
  rest_book_fallback_enabled: true
  rest_book_fallback_max_tokens_per_cycle: 8
  # Existing notifier artifact pattern; no SMTP is invoked by the engine.
  notification_enabled: false

# 2026-07-10 WO-50: registered maker live-test decision policy. Frozen
# defaults; future amendments may only tighten and must carry a dated comment.
# The policy indicates a human action only. It never trades, sizes live
# orders, or changes any governance gate.
decision_policy:
  enabled: true
  decision_date: "2026-07-20"
  composition_stable_days: 7
  composition_required_recurrence: 4
  below_target_review_runs: 7
  below_target_review_threshold: 3
  stage0_capital_usd: 100.0
  stage1_capital_usd: 250.0
  stage2_capital_usd: 500.0
  stage1_min_consecutive_days: 7
  stage2_additional_days: 14
  stage2_reward_realisation_multiple: 0.5
  kill_cumulative_net_score_usd: -25.0
  kill_single_day_net_usd: -15.0
  kill_fill_overrun_days: 2
  fill_alert_multiple: 2.0
  kelly_fraction_cap: 1.0
  quarter_kelly_multiplier: 0.25
  # 2026-07-11 WO-59 tighten-only: shrink the advisory Kelly ceiling toward
  # no edge until 20 distinct daily observations. Values below 20 are clamped.
  kelly_full_weight_days: 20

# 2026-07-11 WO-60: evidence-classed performance packaging only. No gate,
# sizing rule, policy, broker, or order path reads these statistics.
performance_factsheet:
  enabled: true
  risk_free_rate_annual: 0.0
  min_daily_observations: 20
  bootstrap_iterations: 2000
  bootstrap_seed: 20260711
  periods_per_year: 365

# 2026-07-12 WO-68b: human-alert SLO targets for generated operating state.
# These are registered maxima; effective-config overrides can only tighten.
# No gate, broker, sizing rule, policy, or order path reads this block.
operating_state_slos:
  quote_sheet_max_age_seconds: 93600
  governance_refresh_max_duration_seconds: 2400
  max_consecutive_skipped_scheduler_cycles: 0
  websocket_max_gap_seconds: 300
  dashboard_max_age_seconds: 300
  reconciliation_max_age_seconds: 93600
  ledger_anchor_max_age_seconds: 129600

# 2026-07-11 WO-61: daily tamper-evident prefix hashes for the investor-facing
# ledger set. Reporting infrastructure only; no gate, sizing rule, policy,
# broker, or order path reads it. State tables that are legitimately rewritten
# use immutable daily snapshots; every other enrolled file is prefix-verified.
ledger_anchor:
  enabled: true
  external_anchor_branch: vps-anchor
  ledger_globs:
    - {glob: polymarket_portfolio/portfolio_snapshots.csv, mode: append_only}
    - {glob: polymarket_portfolio/cash_ledger.csv, mode: append_only}
    - {glob: polymarket_portfolio/paper_fills.csv, mode: append_only}
    - {glob: polymarket_portfolio/settlements.csv, mode: append_only}
    - {glob: polymarket_shadow/shadow_positions.csv, mode: snapshot}
    - {glob: polymarket_shadow/shadow_fills.csv, mode: append_only}
    - {glob: maker_carry/maker_carry_history.csv, mode: append_only}
    - {glob: maker_carry/maker_live_test_history.csv, mode: append_only}
    - {glob: maker_carry/decision_policy.json, mode: snapshot}
    - {glob: maker_carry/requote_alerts.json, mode: snapshot}
    - {glob: performance/investment_policy_statement.md, mode: snapshot}
    - {glob: performance/investment_policy_statement_summary.json, mode: snapshot}
    - {glob: performance/wallet_reconciliation.json, mode: snapshot}
    - {glob: performance/wallet_contract_registry.json, mode: snapshot}
    - {glob: performance/wallet_reconciliation_history.csv, mode: append_only}
    - {glob: performance/wallet_gas_observations.csv, mode: append_only}
    - {glob: performance/cost_ledger.csv, mode: append_only}
    # 2026-07-12 WO-68b: persist every fail-closed exit-75 supervisor event so
    # clean Docker restarts remain attributable after container replacement.
    - {glob: performance/background_timeout_incidents.csv, mode: append_only}
    - {glob: performance/cost_ledger_summary.json, mode: snapshot}

# 2026-07-11 WO-65: weekly, ledger-only disaster-recovery snapshot. The active
# paper-stage RPO is 7 days and the compressed archive is capped at 50MB.
# BEFORE any wallet/live capital is configured, active_rpo_hours MUST be
# tightened to <=24 with a dated config change; code fails closed otherwise.
disaster_recovery:
  enabled: true
  archive_file: performance/ledger_state_archive.tar.gz
  archive_manifest_file: performance/ledger_state_archive_manifest.json
  status_file: performance/disaster_recovery_status.json
  restore_status_file: performance/restore_verification_status.json
  archive_branch: vps-archive
  size_cap_mb: 50
  active_rpo_hours: 168
  paper_stage_max_rpo_hours: 168
  pre_live_max_rpo_hours: 24
  lock_stale_seconds: 3600

# 2026-07-11 WO-64: generate the investment policy directly from frozen code
# constants plus the loaded effective VPS configuration. Reporting only; no
# gate, sizing rule, broker, or order path reads the output.
ips_render:
  enabled: true
  output_file: performance/investment_policy_statement.md
  summary_file: performance/investment_policy_statement_summary.json

# 2026-07-10 WO-52: hourly adverse-selection concentration study. Advisory
# only; does not alter maker adverse charges, M-gates, sizing, or orders.
hourly_adverse:
  enabled: true
  min_events_per_bucket: 30
  fdr_alpha: 0.10
  price_history_paths:
    - outputs/polymarket_training/historical_price_snapshots.csv

# 2026-07-10 WO-42: favourite/longshot calibration bias study from resolved
# outcomes joined to point-in-time price histories. Study only; no trades.
calibration_bias:
  enabled: true
  price_horizons_hours: [24, 72]
  min_markets_per_bin: 200
  price_bins: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  fdr_alpha: 0.10
# WO-36 step 4: read-only scoreboard for a HUMAN-run minimum-size maker
# experiment. Inert until wallet_address is set. The system never trades;
# it only watches the wallet via free public endpoints.
maker_live_test:
  enabled: true
  # 2026-07-12: Danie's Polymarket account API/profile address (public
  # identifier, read-only monitoring). Deposits go via the bridge, never
  # to this address. Set during the R250 pipe test; SA access verified.
  wallet_address: "0xD2EC3c8f541ad3aaC9396d63650D9d297bd55D2f"
  fill_alert_multiple: 2.0

# 2026-07-11 WO-62: read-only three-way NAV reconciliation for a configured
# human maker-test wallet. Contract addresses are fetched from Polymarket's
# official contracts page; no remembered venue address is accepted. Missing
# RPC/data degrades to partial and never changes a gate or invokes trading.
wallet_reconciliation:
  enabled: true
  data_api_base_url: https://data-api.polymarket.com
  official_contracts_url: https://docs.polymarket.com/resources/contracts
  # 2026-07-13: polygon-rpc.com began requiring an API key (HTTP 401), which
  # broke the on-chain leg of the reconciliation. publicnode is key-less;
  # https://1rpc.io/matic verified as a working manual fallback.
  polygon_rpc_url: https://polygon-bor-rpc.publicnode.com
  request_timeout_seconds: 20
  request_pause_seconds: 0.1
  positions_page_limit: 500
  activity_page_limit: 500
  max_pages: 20
  activity_start_epoch: 1
  max_onchain_positions: 100
  collateral_decimals: 6
  position_decimals: 6
  discrepancy_threshold_usd: 1.0
  starting_nav_usd:
  baseline_epoch: 1
  gas_capture_enabled: true
  gas_scan_max_transactions: 50
  # Optional signer/EOA addresses whose gas is investor-paid. Relayer-paid
  # transactions remain observed but are not attributed as a true cost.
  gas_payer_addresses: []
  max_history_rows: 10000
  max_gas_rows: 100000

# 2026-07-11 WO-63: append-only investor cost accounting. Only gas paid by the
# configured wallet/signers is booked; relayer-paid transactions stay visible
# in WO-62 observations but are excluded. CoinGecko is key-less and fail-soft:
# if POL/USD is unavailable the summary names each required manual entry.
cost_ledger:
  enabled: true
  ledger_file: performance/cost_ledger.csv
  summary_file: performance/cost_ledger_summary.json
  gas_observations_file: performance/wallet_gas_observations.csv
  coingecko_simple_price_url: https://api.coingecko.com/api/v3/simple/price
  pol_coin_id: polygon-ecosystem-token
  request_timeout_seconds: 20
  request_pause_seconds: 0.1
  lock_stale_seconds: 1800
# 2026-07-09 WO-34: negRisk event groups must price to $1; the detector logs
# net-of-fee deviations every scan (persistence = recurrence). Second
# registered edge class; needs NO odds credits. Measurement only.
event_group_consistency:
  enabled: true
  clob_base_url: https://clob.polymarket.com
  event_pages: 3
  page_size: 100
  min_leg_count: 3
  deviation_threshold_per_basket: 0.002
  max_ledger_rows: 100000
# 2026-07-10 WO-41: Frechet/Boole implication consistency scan across linked
# World Cup markets. Measurement only; reports structural deviations but
# cannot create signals, change gates, or place/amend/cancel orders.
implication_networks:
  enabled: true
  gamma_base_url: https://gamma-api.polymarket.com
  event_pages: 3
  page_size: 100
  deviation_threshold_per_basket: 0.005
  max_ledger_rows: 100000
  request_timeout_seconds: 20
  request_pause_seconds: 0.1
  min_continent_member_markets: 2
  min_matchups_per_team: 2
historical_price_history:
  clob_base_url: https://clob.polymarket.com
  max_tokens: 500
  interval: max
  fidelity_seconds: 300
  request_timeout_seconds: 30
  request_pause_seconds: 0.1
# 2026-07-10 WO-43: martingale drift scan. Study-only; estimates
# E[dP | price bin, time-to-close bin, category] from harvested CLOB price
# histories with market-clustered bootstrap and BH-FDR. It never creates a
# lane, relaxes a gate, or invokes paper/live trading.
drift_scan:
  enabled: true
  horizons_hours: [24, 48]
  price_bins:
  - 0.05
  - 0.10
  - 0.15
  - 0.20
  - 0.25
  - 0.30
  - 0.35
  - 0.40
  - 0.45
  - 0.50
  - 0.55
  - 0.60
  - 0.65
  - 0.70
  - 0.75
  - 0.80
  - 0.85
  - 0.90
  - 0.95
  time_to_close_bins_hours: [24, 72, 168]
  min_markets_per_bin: 150
  fdr_alpha: 0.10
  taker_fee_rate: 0.05
  exit_cost_per_dollar: 0.005
  adverse_cost_per_dollar: 0.005
splits:
  method: time_based
  train_fraction: 0.6
  validation_fraction: 0.2
  test_fraction: 0.2
holdout:
  untouched_final_holdout_fraction: 0.1
  minimum_holdout_rows: 100
model:
  type: calibrated_logistic_or_midpoint_shrinkage
  minimum_training_rows: 100
  probability_shrinkage_to_midpoint: 0.35
  random_seed: 20260623
calibration:
  methods:
  - isotonic
  - platt
  - midpoint_shrinkage
  buckets: 10
  maximum_calibration_error: 0.05
calibration_v2:
  buckets: 10
  minimum_training_rows: 100
  min_rows_per_category: 50
  bucket_shrinkage_to_midpoint: 0.2
ml_optimization:
  enabled: true
  minimum_rows: 100
  minimum_markets: 20
  minimum_train_markets: 5
  final_holdout_fraction: 0.2
  minimum_holdout_rows: 50
  minimum_holdout_markets: 3
  walk_forward_splits: 4
  max_rows_per_token: 12
  candidate_l2:
  - 0.1
  - 0.3
  - 1.0
  - 3.0
  - 10.0
  min_brier_gain: 0.0
  bootstrap_iterations: 1000
  random_seed: 20260623
mispricing_alpha:
  enabled: true
  target_monthly_profit_usdc: 100
  target_metric_min_price: 0.05
  minimum_rows: 100
  probability_buckets: 10
  minimum_cell_rows: 8
  minimum_live_cell_rows: 8
  bias_prior_strength: 25
  bias_alpha_shrinkage: 0.5
  model_residual_shrinkage: 0.0
  max_model_residual_adjustment: 0.0
  use_fundamental_probabilities: true
  fundamental_probability_paths:
  # Independent sharp anchors first (each wins per token); falls back to repo/consensus fairs.
  - outputs/polymarket_training/sharp_fundamental_probabilities.csv
  - outputs/polymarket_training/crypto_fundamental_probabilities.csv
  - outputs/polymarket/repo_worldcup_winner_probabilities.csv
  - inputs/polymarket/model_probabilities.csv
  fundamental_residual_shrinkage: 0.35
  fundamental_probability_haircut: 0.5
  require_fundamental_cross_check_for_trading: true
  minimum_fundamental_edge_after_haircut: 0.03
  max_fundamental_adjustment: 0.12
  max_alpha_probability_deviation_from_market: 0.25
  edge_field_for_trading: edge_lower_bound
  require_alpha_trade_candidate: true
  require_same_category_labels_for_trading: true
  minimum_same_category_label_rows_for_trading: 25
  max_spread_for_alpha_trade: 0.04
  max_relative_spread_for_alpha_trade: 0.2
  min_liquidity_for_alpha_trade: 100
  min_price_for_alpha_trade: 0.005
  spread_penalty_weight: 0.5
  low_liquidity_penalty: 0.02
  missing_liquidity_penalty: 0.01
  reference_liquidity: 1000
  depth_imbalance_penalty_weight: 0.02
  execution_cost_probe_stake_usdc: 1.0
  execution_cost_penalty_weight: 1.0
  enrich_with_latest_websocket_quotes: true
  max_websocket_quote_enrichment_age_seconds: 3600
  volatility_penalty_weight: 0.15
  uncertainty_penalty_weight: 0.03
  market_overround_penalty_weight: 0.35
  model_overround_penalty_weight: 0.2
  near_miss_learning:
    enabled: true
    min_raw_edge: 0.05
    min_edge_lower_bound: 0.0
    max_edge_lower_bound: 0.03
    min_liquidity: 100
    max_spread: 0.04
    max_relative_spread: 0.2
    max_candidates: 25
sharp_anchor:
  # Sharper independent source for the mispricing-alpha fundamental slot (e.g. Pinnacle/Betfair).
  # Provide a CSV at input_path with columns: market_slug,outcome,decimal_odds (and optionally
  # token_id to skip the join). De-vig within each market; output feeds fundamental_probability_paths.
  input_path: inputs/polymarket/sharp_odds.csv
  devig_method: power            # power (favourite-longshot aware) or multiplicative
  source_name: pinnacle_close
  token_map_path: outputs/polymarket/market_snapshot.csv
  worldcup_public_search_enabled: true
  worldcup_public_search_queries:
  - fifa world cup
  - world cup winner
  # Optional token enrichment for h2h bookmaker rows. Uses exact fixture public-search queries and
  # maps only explicit binary YES questions such as "Will Spain win on DATE?" and "Will Spain vs
  # France end in a draw?". It never maps NO to the opponent because soccer h2h rows can include
  # draws.
  match_public_search_enabled: true
  match_public_search_max_queries: 20
  match_public_search_limit_per_type: 10
  match_public_search_timeout_seconds: 20
  # Fail closed if an odds group looks partial. A World Cup outright with only France/Spain rows
  # would otherwise be de-vigged as if every other team did not exist, manufacturing false edge.
  min_outcomes_per_market: 2
  min_market_implied_sum: 0.90
  max_market_implied_sum: 2.00
  # Knockout "to advance/qualify" markets are not the same as 90-minute h2h win markets. When a
  # local Polymarket token map exposes an advance YES token, build a labelled conservative
  # composite fair: regulation-win fair + draw fair * advance_composite_draw_split. Keep this
  # visible in the output as anchor_type=advance_composite_from_h2h so model/governance layers can
  # haircut or quarantine it separately from pure sharp-result anchors.
  advance_composite_enabled: true
  advance_composite_draw_split: 0.50
sharp_odds_fetch:
  # Automated fetch for the sharp anchor. The Odds API aggregates Pinnacle + Betfair Exchange.
  # Set the key in the environment (never commit it): export THE_ODDS_API_KEY=...
  # fetch-sharp-odds writes input_path above; refresh-sharp-anchor fetches then de-vigs.
  # World Cup winner is an outright/futures market, not a match h2h market.
  provider: the_odds_api
  base_url: https://api.the-odds-api.com/v4
  api_key_env: THE_ODDS_API_KEY
  # WO-30 (2026-07-05): fetch only markets Polymarket actually lists. Verified via the Gamma API,
  # Polymarket has NO per-game/per-match sports markets - only outrights/futures/advance markets.
  # So per-game h2h for NBA/MLB/MMA/tennis mapped to nothing and burned Odds API budget every cycle.
  # Keep: WC winner outright + WC h2h (the latter feeds the WO-29 composite "advance" fair for the
  #   "Nation To Reach QF/SF" markets, which DO exist on Polymarket).
  # Swap: NBA/MLB per-game h2h -> championship-winner outrights (match Polymarket "NBA 2027 Champion"
  #   / "MLB World Series Champion" futures).
  # Removed: mma_mixed_martial_arts / tennis_atp / tennis_wta h2h - Polymarket lists no mappable
  #   market for these (no per-fight/per-match token, no advance equivalent). Removed to stop waste,
  #   not because odds are unavailable. validate_sports below skips any key the provider does not
  #   expose, so unknown futures keys are logged-and-skipped, never fatal.
  sports:
  - key: soccer_fifa_world_cup_winner
    markets: outrights
  - key: soccer_fifa_world_cup
    markets: h2h
  - key: basketball_nba_championship_winner
    markets: outrights
  # 2026-07-08: baseball_mlb_world_series_winner/outrights removed per the
  # standing WO-31 flag - it mapped ZERO Polymarket tokens across the whole
  # flag window while spending ~2 credits (eu+uk) every fetch cycle. Restore
  # only after an MLB anchor mapping lane exists (WO-32 candidate).
  regions: eu,uk                 # Pinnacle is in eu; Betfair Exchange in uk/eu
  markets: h2h
  validate_sports: true
  max_requests_per_run: 5
  # 2026-07-06: raised from 60 to 180. The free Odds API tier is ~500 requests/month; the hourly
  # cadence (2 paid requests/cycle for the two live WC keys = ~48/day) would exhaust the remaining
  # quota days BEFORE the World Cup final (2026-07-19) - exactly when the anchor matters most.
  # At 180 min (~16/day) the quota covers the whole tournament with margin. Sharp outright lines
  # move slowly intraday, and CLV closing lines come from the Polymarket websocket side, so
  # 3-hourly anchor sampling loses nothing material.
  fetch_interval_minutes: 180
  bookmaker_priority:
  - pinnacle
  - betfair_ex_eu
  - betfair_ex_uk
  odds_format: decimal
  output_path: inputs/polymarket/sharp_odds.csv
  fallback_input_paths:
