  sharp_anchor_build_every_iterations: 2
  crypto_fundamental_every_iterations: 12
  mispricing_alpha_every_iterations: 12
  edge_strategy_search_every_iterations: 14
  promoted_rule_shadow_every_iterations: 3
  liquidity_discovery_every_iterations: 12
  dashboard_render_every_iterations: 2
paper_market_scan:
  # Local opportunity discovery. "batch" scans the strongest evidence families together so the
  # paper bot can find valid probes faster while the runtime resource guard still skips work when
  # memory is high. Override with POLYMARKET_QUERIES / POLYMARKET_SCAN_QUERY_MODE if needed.
  mode: batch
  max_queries_per_cycle: 8
  prioritize_near_promoted: true
  adaptive_priority_min_value: 3.0
  adaptive_priority_require_positive_evidence: true
  # When price-action feedback says current fast cohorts are negative, reserve
