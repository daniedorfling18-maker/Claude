  # starving other assets while preserving the concentration control.
  evidence_updown_rotation_enabled: true
  evidence_updown_rotation_slots: 1
  # Focused websocket snapshots should follow the UpDown intervals where the
  # strict price-action model has validation-positive repricing evidence. This
  # is collection-only: it does not approve trades or relax paper gates.
  fast_updown_use_price_action_validation_targets: true
