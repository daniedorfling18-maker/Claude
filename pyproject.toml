[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "superbru-score-engine"
version = "0.1.0"
description = "Expected-points score prediction engine for World Cup 2026 Superbru"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
    "requests>=2.28",  # used by scripts/ (scrape_oddspedia_smartbet_text.py); not imported in src/
    "curl_cffi>=0.7",  # used by scripts/scrape_oddspedia_curl.py for TLS impersonation
]

[project.optional-dependencies]
# Test / backtest tooling: pip install -e ".[dev]"
dev = [
    "pytest>=7",
]
# Browser scraping extras: pip install -e ".[scraper]"
# Then: python -m playwright install chrome
scraper = [
    "playwright>=1.44",
    "playwright-stealth>=1.0",
]

[project.scripts]
superbru-score = "superbru_score_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
