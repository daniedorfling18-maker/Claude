[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "superbru-score-engine"
version = "0.1.0"
description = "Research automation engines for World Cup 2026 Superbru and Polymarket shadow trading"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
    "requests>=2.28",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.8",
]
scraper = [
    "playwright>=1.44",
    "playwright-stealth>=1.0",
    "curl_cffi>=0.7",
]
analysis = [
    "matplotlib>=3.7",
]
live = [
    "py-clob-client-v2",
]

[project.scripts]
polymarket-engine = "polymarket_predictive_engine.cli:main"
superbru-score = "superbru_score_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 160
extend-exclude = [
    ".git",
    ".venv",
    "venv",
    "work",
    "outputs",
    "data",
    "node_modules",
]

[tool.ruff.lint]
# Keep the first lint gate intentionally small: syntax/undefined-name failures
# plus invalid escape sequences that compile with warnings today.
select = ["E9", "F63", "F7", "F82", "W605"]
